name: release

# Builds BrewixGames for Mac and Windows on GitHub's free machines and
# publishes both on this repo's Releases page. Runs on every push to the work
# branch, or on demand from the Actions tab (Run workflow).

on:
  push:
    branches: ["claude/beautiful-carson-h75brk"]
    paths: ["app/**", "vault/**", "studio/**", "scripts/make_template.sh", "windows/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  STUDIO_RELEASE: v0.1.${{ github.run_number }}

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - name: Roblox tools to bundle (Rojo, Selene, StyLua, Lune)
        run: |
          cargo binstall -y --locked rojo@7.7.1 selene@0.31.0 stylua@2.6.0 lune@0.11.1
          mkdir -p src/app/src-tauri/tools
          for t in rojo selene stylua lune; do cp "$HOME/.cargo/bin/$t" src/app/src-tauri/tools/; done
      - name: Studio template (vault, agents, config)
        run: sh src/scripts/make_template.sh
      - name: Build BrewixGames.app and .dmg
        working-directory: src/app
        run: |
          npm install
          npm run build -- --config src-tauri/tauri.release.json
      - name: Check and package
        run: |
          APP="src/app/src-tauri/target/release/bundle/macos/BrewixGames.app"
          test -x "$APP/Contents/MacOS/brewixgames"
          test -f "$APP/Contents/Resources/studio-template.tar.gz"
          for t in rojo selene stylua lune; do test -x "$APP/Contents/Resources/tools/$t"; done
          codesign --verify --verbose "$APP" || true
          mkdir out
          ditto -c -k --keepParent "$APP" out/BrewixGames-macos.zip
          cp src/app/src-tauri/target/release/bundle/dmg/*.dmg out/BrewixGames.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: out/*

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - name: Roblox tools to bundle (Rojo, Selene, StyLua, Lune)
        run: |
          cargo binstall -y --locked rojo@7.7.1 selene@0.31.0 stylua@2.6.0 lune@0.11.1
          mkdir -p src/app/src-tauri/tools
          for t in rojo selene stylua lune; do cp "$HOME/.cargo/bin/$t.exe" src/app/src-tauri/tools/; done
      - name: Studio template (vault, agents, config)
        run: sh src/scripts/make_template.sh
      - name: Build the Windows installer
        working-directory: src/app
        run: |
          npm install
          npm run build -- --config src-tauri/tauri.windows.json
      - name: Check and package
        run: |
          SETUP=$(ls src/app/src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          test -f "$SETUP"
          test -f src/app/src-tauri/target/release/brewixgames.exe
          mkdir out
          cp "$SETUP" out/BrewixGames-windows-setup.exe
          cp src/windows/*.bat out/
          (cd src/windows && 7z a ../../out/BrewixGames-windows-scripts.zip *.bat README.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  test-windows-update:
    # Installs the new build, then runs the same install-and-reopen handoff
    # the Update button uses, and checks the reopened app is the installed
    # new version. Nothing is published unless this passes.
    needs: [build-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: out
      - name: Install, update through the app's handoff, and check it reopened
        shell: pwsh
        run: |
          $setup = (Resolve-Path out\BrewixGames-windows-setup.exe).Path
          Start-Process -FilePath $setup -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Depth 3 -Filter 'brewixgames.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "installed brewixgames.exe not found under LOCALAPPDATA" }
          Write-Host "Installed at $($exe.FullName)"
          if (-not (Test-Path (Join-Path $exe.DirectoryName 'studio-template.tar.gz'))) { throw "studio-template.tar.gz is not next to the installed exe" }
          if (-not (Test-Path (Join-Path $exe.DirectoryName 'tools\rojo.exe'))) { throw "bundled tools missing next to the installed exe" }
          $marker = Join-Path $env:RUNNER_TEMP 'reopened.txt'
          $before = (Get-Item $exe.FullName).LastWriteTimeUtc
          Start-Process -FilePath $exe.FullName -ArgumentList 'selftest-handoff',$setup,$marker
          $deadline = (Get-Date).AddMinutes(4)
          while (-not (Test-Path $marker) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 3 }
          if (-not (Test-Path $marker)) { throw "the app did not reopen after the installer finished" }
          $got = Get-Content $marker -Raw
          Write-Host "Reopened app reports: $got"
          if ($got -notmatch [regex]::Escape($env:STUDIO_RELEASE)) { throw "reopened app is not $env:STUDIO_RELEASE" }
          if ($got -notmatch 'installed') { throw "reopened app does not see itself as installed, so Update would not work" }
          Write-Host "Installer ran (exe rewritten: $before -> $((Get-Item $exe.FullName).LastWriteTimeUtc))"

  test-windows-apps:
    # Installs Blender (portable) and Obsidian into a test Downloads folder
    # and checks where they landed. Informative: does not block releases.
    needs: [build-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: out
      - name: Install Blender and Obsidian into the Downloads folder
        shell: pwsh
        run: |
          Start-Process -FilePath (Resolve-Path out\BrewixGames-windows-setup.exe).Path -ArgumentList '/S' -Wait
          $exe = (Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Depth 3 -Filter 'brewixgames.exe' | Select-Object -First 1).FullName
          $studio = Join-Path $env:RUNNER_TEMP 'Studio With Space'
          New-Item -ItemType Directory -Force -Path (Join-Path $studio 'studio') | Out-Null
          '{"agents":{}}' | Set-Content (Join-Path $studio 'studio\agents.json')
          $env:ROBUX_STUDIO_ROOT = $studio
          $results = @()
          foreach ($app in 'obsidian','blender') {
            $p = Start-Process -FilePath $exe -ArgumentList 'selftest-install',$app -Wait -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\$app.out" -RedirectStandardError "$env:RUNNER_TEMP\$app.err"
            Write-Host "== $app exit $($p.ExitCode)"; Get-Content "$env:RUNNER_TEMP\$app.out","$env:RUNNER_TEMP\$app.err" -ErrorAction SilentlyContinue
            $results += "$app=$($p.ExitCode)"
          }
          Get-ChildItem (Join-Path $studio 'tools') -Depth 1 | Format-Table -AutoSize
          if (-not (Test-Path (Join-Path $studio 'tools\obsidian-app\Obsidian.exe'))) { Write-Host "::warning::Obsidian did not install into the chosen folder" }
          if (-not (Get-ChildItem (Join-Path $studio 'tools\blender-app') -Recurse -Depth 2 -Filter blender.exe -ErrorAction SilentlyContinue)) { Write-Host "::warning::Blender did not install into the chosen folder" }
          Write-Host "Results: $($results -join ', ')"

  publish:
    needs: [build-mac, build-windows, test-windows-update]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release create "$STUDIO_RELEASE" out/* \
            -R "$GITHUB_REPOSITORY" \
            --title "BrewixGames $STUDIO_RELEASE" \
            --notes "Mac: download BrewixGames.dmg, open it, and drag BrewixGames to Applications.

          Windows: download INSTALL_WINDOWS.bat and double-click it (or run BrewixGames-windows-setup.exe yourself). After that, RUN_WINDOWS.bat opens the app and UPDATE_WINDOWS.bat gets the newest version.

          source: ${{ github.sha }}"
