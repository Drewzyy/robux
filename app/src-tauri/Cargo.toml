[package]
name = "robux-studio"
version = "0.1.0"
description = "Internal agent studio for Andrew's Roblox games. Local only."
edition = "2021"
publish = false

[lib]
name = "studio_core"
path = "src/lib.rs"

[[bin]]
name = "robux-studio"
path = "src/main.rs"

[[bin]]
name = "studio-cli"
path = "src/bin/studio-cli.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
strip = true
