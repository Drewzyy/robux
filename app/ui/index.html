<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BrewixGames</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-title">BrewixGames <span id="app-version" class="app-version"></span></div>
      <nav id="nav">
        <a href="#home" data-route="home"><span class="ic" data-icon="spark"></span>Home</a>
        <a href="#money" data-route="money"><span class="ic" data-icon="pulse"></span>Money</a>
        <a href="#queue" data-route="queue"><span class="ic" data-icon="tray"></span>Review Queue<span id="nav-count" class="nav-count"></span></a>
        <a href="#chat" data-route="chat"><span class="ic" data-icon="chat"></span>Ask Claude</a>
        <a href="#agents" data-route="agents"><span class="ic" data-icon="people"></span>Agents</a>
        <a href="#simulator" data-route="simulator"><span class="ic" data-icon="pulse"></span>Simulator</a>
        <a href="#review" data-route="review"><span class="ic" data-icon="check"></span>Second Opinion</a>
        <a href="#plans" data-route="plans"><span class="ic" data-icon="spark"></span>Game Plan</a>
        <a href="#references" data-route="references"><span class="ic" data-icon="image"></span>References</a>
        <a href="#thumbnails" data-route="thumbnails"><span class="ic" data-icon="image"></span>Thumbnails</a>
        <a href="#vault" data-route="vault"><span class="ic" data-icon="book"></span>Vault</a>
        <a href="#runs" data-route="runs"><span class="ic" data-icon="list"></span>Runs</a>
        <a href="#settings" data-route="settings"><span class="ic" data-icon="gear"></span>Settings</a>
      </nav>
      <div class="sidebar-status" id="status">
        <div class="status-row"><span id="claude-dot" class="dot"></span><span id="claude-line">Checking Claude…</span></div>
        <div class="status-row secondary" id="running-line">No run in progress</div>
        <div class="budget-line" title="Not billed: counts toward your Claude plan limits. Dollars are the API-equivalent size."><span id="spend-line">Plan usage: …</span></div>
        <div class="bar"><div id="spend-bar"></div></div>
      </div>
    </aside>

    <main id="view" class="view"></main>
  </div>

  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-body">
      <div class="sheet-head">
        <div id="sheet-title" class="sheet-title"></div>
        <button id="sheet-close" class="btn secondary small">Done</button>
      </div>
      <div id="sheet-content" class="sheet-content"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
