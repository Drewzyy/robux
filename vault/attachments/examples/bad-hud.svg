<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
<title>Bad HUD on a phone</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#2a1a1a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#7a2a2a" stroke-width="4"/></pattern></defs>
<rect width="1600" height="900" fill="#111"/>
<text x="40" y="56" font-size="38" fill="#fff" text-anchor="start" font-weight="bold" >Bad HUD on a phone</text><text x="40" y="92" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Same game, five mistakes. Every one costs taps, readability or trust.</text><rect x="40" y="130" width="1040" height="468" rx="14" fill="#2b6b8f" stroke="none" stroke-width="2" /><rect x="40" y="420.16" width="1040" height="177.84" rx="0" fill="#4a8f3a" stroke="none" stroke-width="2" /><rect x="533.0" y="420.40000000000003" width="54.0" height="48.0" rx="4.8" fill="#3B82F6" stroke="#111" stroke-width="3" /><rect x="530.0" y="357.40000000000003" width="60" height="60" rx="7.199999999999999" fill="#FFD27F" stroke="#111" stroke-width="3" /><circle cx="548.0" cy="382.6" r="5.3999999999999995" fill="#111" stroke="none" stroke-width="2"/><circle cx="572.0" cy="382.6" r="5.3999999999999995" fill="#111" stroke="none" stroke-width="2"/><path d="M546.8,396.40000000000003 Q560.0,410.20000000000005 573.2,396.40000000000003" fill="none" stroke="#111" stroke-width="3" /><rect x="40" y="457.59999999999997" width="312.0" height="140.4" rx="0" fill="#fff" stroke="none" stroke-width="0" opacity="0.10"/><rect x="820.0" y="457.59999999999997" width="260.0" height="140.4" rx="0" fill="#fff" stroke="none" stroke-width="0" opacity="0.10"/><text x="60" y="586" font-size="16" fill="#cde" text-anchor="start" font-weight="normal" >thumb zone: joystick</text><text x="1060" y="586" font-size="16" fill="#cde" text-anchor="end" font-weight="normal" >thumb zone: jump</text><rect x="40" y="130" width="1040" height="71" rx="0" fill="url(#hatch)" stroke="none" stroke-width="2" /><text x="560.0" y="174" font-size="18" fill="#f99" text-anchor="middle" font-weight="normal" >Roblox top bar: 58 px, keep clear</text><rect x="410.0" y="138" width="300" height="40" rx="8" fill="#c33" stroke="none" stroke-width="2" /><text x="560.0" y="165" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold" >SHOP  SALE  VIP</text><rect x="60" y="488" width="54" height="54" rx="8" fill="#e44" stroke="#fff" stroke-width="2" /><rect x="122" y="488" width="54" height="54" rx="8" fill="#4a4" stroke="#fff" stroke-width="2" /><rect x="184" y="488" width="54" height="54" rx="8" fill="#44e" stroke="#fff" stroke-width="2" /><rect x="246" y="488" width="54" height="54" rx="8" fill="#ea4" stroke="#fff" stroke-width="2" /><rect x="308" y="488" width="54" height="54" rx="8" fill="#a4e" stroke="#fff" stroke-width="2" /><rect x="370" y="488" width="54" height="54" rx="8" fill="#4ae" stroke="#fff" stroke-width="2" /><rect x="432" y="488" width="54" height="54" rx="8" fill="#888" stroke="#fff" stroke-width="2" /><text x="70" y="225" font-size="11" fill="#bbb" text-anchor="start" font-weight="normal" >coins 1250 gems 33 xp 8/90 lvl 4 hp 100 mana 40</text><rect x="750" y="240" width="310" height="64" rx="10" fill="#e44" stroke="none" stroke-width="2" /><text x="905" y="280" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" >BUY 2X COINS NOW!!!</text><rect x="370.0" y="310" width="380" height="170" rx="12" fill="#fff" stroke="none" stroke-width="2" /><text x="560.0" y="380" font-size="32" fill="#c00" text-anchor="middle" font-weight="bold" >LIMITED OFFER</text><text x="560.0" y="420" font-size="22" fill="#333" text-anchor="middle" font-weight="normal" >ends in 00:09</text><rect x="720.0" y="314" width="14" height="14" rx="2" fill="#ccc" stroke="none" stroke-width="2" /><circle cx="640.0" cy="158" r="15" fill="#f66" stroke="#111" stroke-width="2"/><text x="640.0" y="164" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><circle cx="60" cy="216" r="15" fill="#f66" stroke="#111" stroke-width="2"/><text x="60" y="222" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><circle cx="740" cy="250" r="15" fill="#f66" stroke="#111" stroke-width="2"/><text x="740" y="256" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><circle cx="360.0" cy="320" r="15" fill="#f66" stroke="#111" stroke-width="2"/><text x="360.0" y="326" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >4</text><circle cx="60" cy="478" r="15" fill="#f66" stroke="#111" stroke-width="2"/><text x="60" y="484" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >5</text><text x="1120" y="150" font-size="26" fill="#f66" text-anchor="start" font-weight="bold" >What is wrong</text><circle cx="1135" cy="186" r="15" fill="#f66" stroke="#111" stroke-width="2"/><text x="1135" y="192" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><text x="1160" y="192" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Buttons inside the top bar zone: Roblox UI</text><text x="1160" y="216" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >covers or blocks them.</text><circle cx="1135" cy="260" r="15" fill="#f66" stroke="#111" stroke-width="2"/><text x="1135" y="266" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><text x="1160" y="266" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >11 px stats crammed together: unreadable on</text><text x="1160" y="290" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >a phone.</text><circle cx="1135" cy="334" r="15" fill="#f66" stroke="#111" stroke-width="2"/><text x="1135" y="340" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><text x="1160" y="340" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Pushy buy prompt on screen during play.</text><text x="1160" y="364" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Purchase prompts come from a player tap</text><text x="1160" y="388" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >only.</text><circle cx="1135" cy="432" r="15" fill="#f66" stroke="#111" stroke-width="2"/><text x="1135" y="438" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >4</text><text x="1160" y="438" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Popup with fake timer and tiny close box</text><text x="1160" y="462" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >covers the action. Pressure and hard to</text><text x="1160" y="486" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >dismiss.</text><circle cx="1135" cy="530" r="15" fill="#f66" stroke="#111" stroke-width="2"/><text x="1135" y="536" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >5</text><text x="1160" y="536" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Seven buttons in the thumb zone fight the</text><text x="1160" y="560" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >joystick. Misses on every tap.</text>
</svg>