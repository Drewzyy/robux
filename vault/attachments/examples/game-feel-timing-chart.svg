<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
<title>Game feel timing chart</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#2a1a1a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#7a2a2a" stroke-width="4"/></pattern></defs>
<rect width="1600" height="900" fill="#111"/>
<text x="40" y="56" font-size="38" fill="#fff" text-anchor="start" font-weight="bold" >Game feel timing chart</text><text x="40" y="92" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >One heavy hit, 0 to 300 ms. Layer small effects; each alone is subtle.</text><line x1="260" y1="150" x2="260" y2="700" stroke="#445" stroke-width="2" /><line x1="260.0" y1="150" x2="260.0" y2="700" stroke="#2a3340" stroke-width="1" /><text x="260.0" y="730" font-size="16" fill="#9aa" text-anchor="middle" font-weight="normal" >0 ms</text><line x1="466.66666666666663" y1="150" x2="466.66666666666663" y2="700" stroke="#2a3340" stroke-width="1" /><text x="466.66666666666663" y="730" font-size="16" fill="#9aa" text-anchor="middle" font-weight="normal" >50 ms</text><line x1="673.3333333333333" y1="150" x2="673.3333333333333" y2="700" stroke="#2a3340" stroke-width="1" /><text x="673.3333333333333" y="730" font-size="16" fill="#9aa" text-anchor="middle" font-weight="normal" >100 ms</text><line x1="880.0" y1="150" x2="880.0" y2="700" stroke="#2a3340" stroke-width="1" /><text x="880.0" y="730" font-size="16" fill="#9aa" text-anchor="middle" font-weight="normal" >150 ms</text><line x1="1086.6666666666665" y1="150" x2="1086.6666666666665" y2="700" stroke="#2a3340" stroke-width="1" /><text x="1086.6666666666665" y="730" font-size="16" fill="#9aa" text-anchor="middle" font-weight="normal" >200 ms</text><line x1="1293.3333333333333" y1="150" x2="1293.3333333333333" y2="700" stroke="#2a3340" stroke-width="1" /><text x="1293.3333333333333" y="730" font-size="16" fill="#9aa" text-anchor="middle" font-weight="normal" >250 ms</text><line x1="1500.0" y1="150" x2="1500.0" y2="700" stroke="#2a3340" stroke-width="1" /><text x="1500.0" y="730" font-size="16" fill="#9aa" text-anchor="middle" font-weight="normal" >300 ms</text><rect x="260" y="150" width="413.33333333333326" height="550" rx="0" fill="#fff" stroke="none" stroke-width="0" opacity="0.05"/><text x="466.66666666666663" y="172" font-size="15" fill="#7CD86B" text-anchor="middle" font-weight="normal" >input response under 100 ms</text><text x="40" y="205" font-size="22" fill="#fff" text-anchor="start" font-weight="normal" >Input</text><text x="40" y="275" font-size="22" fill="#fff" text-anchor="start" font-weight="normal" >Hit flash</text><text x="40" y="345" font-size="22" fill="#fff" text-anchor="start" font-weight="normal" >Hit-stop</text><text x="40" y="445" font-size="22" fill="#fff" text-anchor="start" font-weight="normal" >Screen shake</text><text x="40" y="585" font-size="22" fill="#fff" text-anchor="start" font-weight="normal" >Squash/stretch</text><rect x="260.0" y="190" width="6" height="20" rx="0" fill="#7CD86B" stroke="none" stroke-width="2" /><rect x="260.0" y="258" width="330.66666666666674" height="24" rx="4" fill="#fff" stroke="none" stroke-width="2" /><text x="611.3333333333333" y="277" font-size="15" fill="#ccc" text-anchor="start" font-weight="normal" >60 to 100 ms white flash</text><rect x="260.0" y="328" width="413.33333333333326" height="24" rx="4" fill="#D55E00" stroke="none" stroke-width="2" /><text x="694.0" y="347" font-size="15" fill="#ccc" text-anchor="start" font-weight="normal" >hit-stop: 50 ms light, 100 to 150 ms heavy, never above 200</text><path d="M673,439 L686,437 L698,435 L711,434 L723,434 L735,434 L748,435 L760,437 L773,438 L785,440 L797,441 L810,443 L822,443 L835,444 L847,443 L859,443 L872,442 L884,441 L897,440 L909,440 L921,439 L934,438 L946,438 L959,438 L971,438 L983,438 L996,439 L1008,440 L1021,440 L1033,440 L1045,441 L1058,441 L1070,441 L1083,441 L1095,441 L1107,441 L1120,440 L1132,440 L1145,440 L1157,440 L1169,439 L1182,439 L1194,439 L1207,439 L1219,440 L1231,440 L1244,440 L1256,440 L1269,440 L1281,440 L1293,440" fill="none" stroke="#56B4E9" stroke-width="3" /><line x1="260" y1="440" x2="1500" y2="440" stroke="#334" stroke-width="1" /><text x="1045.3333333333335" y="392" font-size="15" fill="#ccc" text-anchor="start" font-weight="normal" >shake 120 ms small, 250 ms big, decays fast</text><path d="M260,580 L591,550 L1004,602 L1417,580" fill="none" stroke="#E69F00" stroke-width="4" /><line x1="260" y1="580" x2="1500" y2="580" stroke="#334" stroke-width="1" /><text x="425.33333333333337" y="540" font-size="15" fill="#ccc" text-anchor="middle" font-weight="normal" >stretch 1.2 for 80 ms</text><text x="1045.3333333333335" y="640" font-size="15" fill="#ccc" text-anchor="middle" font-weight="normal" >squash 0.85 for 100 ms</text><text x="1355.3333333333333" y="600" font-size="15" fill="#ccc" text-anchor="middle" font-weight="normal" >back to 1.0</text><circle cx="342.6666666666667" cy="205" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="342.6666666666667" y="211" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><circle cx="508.0" cy="270" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="508.0" y="276" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><circle cx="508.0" cy="340" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="508.0" y="346" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><circle cx="756.0" cy="410" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="756.0" y="416" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >4</text><circle cx="1004.0" cy="560" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1004.0" y="566" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >5</text><text x="40" y="780" font-size="17" fill="#cde" text-anchor="start" font-weight="normal" >1 respond in the first frame   2 flash confirms contact   3 freeze sells weight   4 shake only for big hits, with an off setting   5 keep volume constant</text><text x="40" y="815" font-size="19" fill="#9aa" text-anchor="start" font-weight="normal" >Rules: game-feel-juice  ui-animation  accessibility</text>
</svg>