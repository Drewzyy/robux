<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
<title>Simulator zone layout</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#2a1a1a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#7a2a2a" stroke-width="4"/></pattern></defs>
<rect width="1600" height="900" fill="#111"/>
<text x="40" y="56" font-size="38" fill="#fff" text-anchor="start" font-weight="bold" >Simulator zone layout</text><text x="40" y="92" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Zones in a ring: each wider, richer and gated by a number the player can see and earn.</text><rect x="40" y="120" width="1040" height="720" rx="14" fill="#1e3a1e" stroke="none" stroke-width="2" /><rect x="60" y="160" width="180" height="640" rx="10" fill="#7CD86B" stroke="#111" stroke-width="3" /><text x="150" y="210" font-size="26" fill="#111" text-anchor="middle" font-weight="bold" >Zone 1</text><text x="150" y="250" font-size="20" fill="#111" text-anchor="middle" font-weight="normal" >Meadow</text><text x="150" y="300" font-size="18" fill="#111" text-anchor="middle" font-weight="normal" >x1 value</text><circle cx="90" cy="360" r="10" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="131" cy="443" r="10" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="172" cy="526" r="10" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="213" cy="609" r="10" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="124" cy="372" r="10" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="165" cy="455" r="10" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="206" cy="538" r="10" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="117" cy="621" r="10" fill="#fff" stroke="#111" stroke-width="2"/><rect x="250" y="160" width="180" height="640" rx="10" fill="#56B4E9" stroke="#111" stroke-width="3" /><text x="340" y="210" font-size="26" fill="#111" text-anchor="middle" font-weight="bold" >Zone 2</text><text x="340" y="250" font-size="20" fill="#111" text-anchor="middle" font-weight="normal" >Beach</text><text x="340" y="300" font-size="18" fill="#111" text-anchor="middle" font-weight="normal" >x3 value</text><circle cx="280" cy="360" r="12" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="321" cy="443" r="12" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="362" cy="526" r="12" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="403" cy="609" r="12" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="314" cy="372" r="12" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="355" cy="455" r="12" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="396" cy="538" r="12" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="307" cy="621" r="12" fill="#fff" stroke="#111" stroke-width="2"/><rect x="240" y="430" width="20" height="120" rx="4" fill="#333" stroke="#fff" stroke-width="2" /><text x="230" y="420" font-size="14" fill="#fff" text-anchor="middle" font-weight="normal" >Gate</text><text x="250" y="570" font-size="14" fill="#FFC83D" text-anchor="middle" font-weight="normal" >1k</text><rect x="440" y="160" width="180" height="640" rx="10" fill="#CC79A7" stroke="#111" stroke-width="3" /><text x="530" y="210" font-size="26" fill="#111" text-anchor="middle" font-weight="bold" >Zone 3</text><text x="530" y="250" font-size="20" fill="#111" text-anchor="middle" font-weight="normal" >Crystal</text><text x="530" y="300" font-size="18" fill="#111" text-anchor="middle" font-weight="normal" >x8 value</text><circle cx="470" cy="360" r="14" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="511" cy="443" r="14" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="552" cy="526" r="14" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="593" cy="609" r="14" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="504" cy="372" r="14" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="545" cy="455" r="14" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="586" cy="538" r="14" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="497" cy="621" r="14" fill="#fff" stroke="#111" stroke-width="2"/><rect x="430" y="430" width="20" height="120" rx="4" fill="#333" stroke="#fff" stroke-width="2" /><text x="420" y="420" font-size="14" fill="#fff" text-anchor="middle" font-weight="normal" >Gate</text><text x="440" y="570" font-size="14" fill="#FFC83D" text-anchor="middle" font-weight="normal" >10k</text><rect x="630" y="160" width="180" height="640" rx="10" fill="#E69F00" stroke="#111" stroke-width="3" /><text x="720" y="210" font-size="26" fill="#111" text-anchor="middle" font-weight="bold" >Zone 4</text><text x="720" y="250" font-size="20" fill="#111" text-anchor="middle" font-weight="normal" >Desert</text><text x="720" y="300" font-size="18" fill="#111" text-anchor="middle" font-weight="normal" >x20 value</text><circle cx="660" cy="360" r="16" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="701" cy="443" r="16" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="742" cy="526" r="16" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="783" cy="609" r="16" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="694" cy="372" r="16" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="735" cy="455" r="16" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="776" cy="538" r="16" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="687" cy="621" r="16" fill="#fff" stroke="#111" stroke-width="2"/><rect x="620" y="430" width="20" height="120" rx="4" fill="#333" stroke="#fff" stroke-width="2" /><text x="610" y="420" font-size="14" fill="#fff" text-anchor="middle" font-weight="normal" >Gate</text><text x="630" y="570" font-size="14" fill="#FFC83D" text-anchor="middle" font-weight="normal" >100k</text><rect x="820" y="160" width="180" height="640" rx="10" fill="#D55E00" stroke="#111" stroke-width="3" /><text x="910" y="210" font-size="26" fill="#111" text-anchor="middle" font-weight="bold" >Zone 5</text><text x="910" y="250" font-size="20" fill="#111" text-anchor="middle" font-weight="normal" >Lava</text><text x="910" y="300" font-size="18" fill="#111" text-anchor="middle" font-weight="normal" >x60 value</text><circle cx="850" cy="360" r="18" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="891" cy="443" r="18" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="932" cy="526" r="18" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="973" cy="609" r="18" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="884" cy="372" r="18" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="925" cy="455" r="18" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="966" cy="538" r="18" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="877" cy="621" r="18" fill="#fff" stroke="#111" stroke-width="2"/><rect x="810" y="430" width="20" height="120" rx="4" fill="#333" stroke="#fff" stroke-width="2" /><text x="800" y="420" font-size="14" fill="#fff" text-anchor="middle" font-weight="normal" >Gate</text><text x="820" y="570" font-size="14" fill="#FFC83D" text-anchor="middle" font-weight="normal" >1M</text><rect x="60" y="720" width="110" height="60" rx="8" fill="#FFC83D" stroke="#111" stroke-width="3" /><text x="115" y="757" font-size="22" fill="#111" text-anchor="middle" font-weight="bold" >SELL</text><rect x="250" y="720" width="110" height="60" rx="8" fill="#fff" stroke="#111" stroke-width="3" /><text x="305" y="757" font-size="22" fill="#111" text-anchor="middle" font-weight="bold" >EGGS</text><circle cx="150" cy="205" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="150" y="211" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><circle cx="115" cy="720" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="115" y="726" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><circle cx="440" cy="420" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="440" y="426" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><circle cx="305" cy="720" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="305" y="726" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >4</text><text x="1110" y="140" font-size="26" fill="#FFC83D" text-anchor="start" font-weight="bold" >Why this works</text><circle cx="1125" cy="176" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="182" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><text x="1150" y="182" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Zones left to right: the player reads</text><text x="1150" y="206" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >progression from the map.</text><circle cx="1125" cy="250" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="256" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><text x="1150" y="256" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Sell point sits at spawn: carrying loot back</text><text x="1150" y="280" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >is short.</text><circle cx="1125" cy="324" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="330" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><text x="1150" y="330" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Gate shows its price on the wall. Walk up,</text><text x="1150" y="354" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >afford, pass.</text><circle cx="1125" cy="398" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="404" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >4</text><text x="1150" y="404" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Eggs near sell, so new pets arrive right</text><text x="1150" y="428" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >when coins do.</text><circle cx="1125" cy="472" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="478" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >5</text><text x="1150" y="478" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Each zone has its own colour and landmark so</text><text x="1150" y="502" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >players know where they are.</text><text x="1110" y="700" font-size="18" fill="#9aa" text-anchor="start" font-weight="normal" >Each zone about 3 to 5x the value of the last, tuned in the economy sheet.</text><text x="1110" y="730" font-size="19" fill="#9aa" text-anchor="start" font-weight="normal" >Rules: economy-math  loop-stack</text>
</svg>