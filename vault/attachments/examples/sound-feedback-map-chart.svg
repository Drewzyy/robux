<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
<title>Sound feedback map chart</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#2a1a1a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#7a2a2a" stroke-width="4"/></pattern></defs>
<rect width="1600" height="900" fill="#111"/>
<text x="40" y="56" font-size="38" fill="#fff" text-anchor="start" font-weight="bold" >Sound feedback map</text><text x="40" y="92" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Which event gets which layers. Random pitch 0.9 to 1.1 so repeats do not grate.</text><rect x="40" y="130" width="260" height="44" rx="0" fill="#2f4a64" stroke="#111" stroke-width="2" /><text x="50" y="160" font-size="20" fill="#fff" text-anchor="start" font-weight="bold" >Event</text><rect x="320" y="130" width="160" height="44" rx="0" fill="#2f4a64" stroke="#111" stroke-width="2" /><text x="330" y="160" font-size="20" fill="#fff" text-anchor="start" font-weight="bold" >Transient</text><rect x="490" y="130" width="160" height="44" rx="0" fill="#2f4a64" stroke="#111" stroke-width="2" /><text x="500" y="160" font-size="20" fill="#fff" text-anchor="start" font-weight="bold" >Body</text><rect x="660" y="130" width="160" height="44" rx="0" fill="#2f4a64" stroke="#111" stroke-width="2" /><text x="670" y="160" font-size="20" fill="#fff" text-anchor="start" font-weight="bold" >Tail</text><rect x="830" y="130" width="420" height="44" rx="0" fill="#2f4a64" stroke="#111" stroke-width="2" /><text x="840" y="160" font-size="20" fill="#fff" text-anchor="start" font-weight="bold" >Note</text><rect x="1270" y="130" width="140" height="44" rx="0" fill="#2f4a64" stroke="#111" stroke-width="2" /><text x="1280" y="160" font-size="20" fill="#fff" text-anchor="start" font-weight="bold" >Length</text><rect x="40" y="174" width="260" height="72" rx="0" fill="#1b2a3a" stroke="#111" stroke-width="2" /><text x="50" y="218" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Button tap</text><rect x="320" y="174" width="160" height="72" rx="0" fill="#1b2a3a" stroke="#111" stroke-width="2" /><text x="330" y="218" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >click</text><rect x="490" y="174" width="160" height="72" rx="0" fill="#1b2a3a" stroke="#111" stroke-width="2" /><text x="500" y="218" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >-</text><rect x="660" y="174" width="160" height="72" rx="0" fill="#1b2a3a" stroke="#111" stroke-width="2" /><text x="670" y="218" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >-</text><rect x="830" y="174" width="420" height="72" rx="0" fill="#1b2a3a" stroke="#111" stroke-width="2" /><text x="840" y="218" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >UI group, soft</text><rect x="1270" y="174" width="140" height="72" rx="0" fill="#1b2a3a" stroke="#111" stroke-width="2" /><text x="1280" y="218" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >80 ms</text><rect x="40" y="246" width="260" height="72" rx="0" fill="#16222f" stroke="#111" stroke-width="2" /><text x="50" y="290" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Coin pickup</text><rect x="320" y="246" width="160" height="72" rx="0" fill="#16222f" stroke="#111" stroke-width="2" /><text x="330" y="290" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >tick</text><rect x="490" y="246" width="160" height="72" rx="0" fill="#16222f" stroke="#111" stroke-width="2" /><text x="500" y="290" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >chime</text><rect x="660" y="246" width="160" height="72" rx="0" fill="#16222f" stroke="#111" stroke-width="2" /><text x="670" y="290" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >-</text><rect x="830" y="246" width="420" height="72" rx="0" fill="#16222f" stroke="#111" stroke-width="2" /><text x="840" y="290" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >pitch climbs in combo</text><rect x="1270" y="246" width="140" height="72" rx="0" fill="#16222f" stroke="#111" stroke-width="2" /><text x="1280" y="290" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >100 ms</text><rect x="40" y="318" width="260" height="72" rx="0" fill="#1b2a3a" stroke="#111" stroke-width="2" /><text x="50" y="362" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Hit</text><rect x="320" y="318" width="160" height="72" rx="0" fill="#1b2a3a" stroke="#111" stroke-width="2" /><text x="330" y="362" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >click</text><rect x="490" y="318" width="160" height="72" rx="0" fill="#1b2a3a" stroke="#111" stroke-width="2" /><text x="500" y="362" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >thump</text><rect x="660" y="318" width="160" height="72" rx="0" fill="#1b2a3a" stroke="#111" stroke-width="2" /><text x="670" y="362" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >-</text><rect x="830" y="318" width="420" height="72" rx="0" fill="#1b2a3a" stroke="#111" stroke-width="2" /><text x="840" y="362" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >3 layers, pitch random</text><rect x="1270" y="318" width="140" height="72" rx="0" fill="#1b2a3a" stroke="#111" stroke-width="2" /><text x="1280" y="362" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >50 ms</text><rect x="40" y="390" width="260" height="72" rx="0" fill="#16222f" stroke="#111" stroke-width="2" /><text x="50" y="434" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Crit / kill</text><rect x="320" y="390" width="160" height="72" rx="0" fill="#16222f" stroke="#111" stroke-width="2" /><text x="330" y="434" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >click</text><rect x="490" y="390" width="160" height="72" rx="0" fill="#16222f" stroke="#111" stroke-width="2" /><text x="500" y="434" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >thump</text><rect x="660" y="390" width="160" height="72" rx="0" fill="#16222f" stroke="#111" stroke-width="2" /><text x="670" y="434" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >sparkle</text><rect x="830" y="390" width="420" height="72" rx="0" fill="#16222f" stroke="#111" stroke-width="2" /><text x="840" y="434" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >hit-stop 100 ms</text><rect x="1270" y="390" width="140" height="72" rx="0" fill="#16222f" stroke="#111" stroke-width="2" /><text x="1280" y="434" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >250 ms</text><rect x="40" y="462" width="260" height="72" rx="0" fill="#1b2a3a" stroke="#111" stroke-width="2" /><text x="50" y="506" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Level up</text><rect x="320" y="462" width="160" height="72" rx="0" fill="#1b2a3a" stroke="#111" stroke-width="2" /><text x="330" y="506" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >pop</text><rect x="490" y="462" width="160" height="72" rx="0" fill="#1b2a3a" stroke="#111" stroke-width="2" /><text x="500" y="506" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >chord</text><rect x="660" y="462" width="160" height="72" rx="0" fill="#1b2a3a" stroke="#111" stroke-width="2" /><text x="670" y="506" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >sweep</text><rect x="830" y="462" width="420" height="72" rx="0" fill="#1b2a3a" stroke="#111" stroke-width="2" /><text x="840" y="506" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >fanfare 1 to 2 s</text><rect x="1270" y="462" width="140" height="72" rx="0" fill="#1b2a3a" stroke="#111" stroke-width="2" /><text x="1280" y="506" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >1.5 s</text><rect x="40" y="534" width="260" height="72" rx="0" fill="#16222f" stroke="#111" stroke-width="2" /><text x="50" y="578" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Reward reveal</text><rect x="320" y="534" width="160" height="72" rx="0" fill="#16222f" stroke="#111" stroke-width="2" /><text x="330" y="578" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >rise</text><rect x="490" y="534" width="160" height="72" rx="0" fill="#16222f" stroke="#111" stroke-width="2" /><text x="500" y="578" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >pop</text><rect x="660" y="534" width="160" height="72" rx="0" fill="#16222f" stroke="#111" stroke-width="2" /><text x="670" y="578" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >fanfare</text><rect x="830" y="534" width="420" height="72" rx="0" fill="#16222f" stroke="#111" stroke-width="2" /><text x="840" y="578" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >pitch up by rarity</text><rect x="1270" y="534" width="140" height="72" rx="0" fill="#16222f" stroke="#111" stroke-width="2" /><text x="1280" y="578" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >4 s</text><rect x="40" y="606" width="260" height="72" rx="0" fill="#1b2a3a" stroke="#111" stroke-width="2" /><text x="50" y="650" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Error / deny</text><rect x="320" y="606" width="160" height="72" rx="0" fill="#1b2a3a" stroke="#111" stroke-width="2" /><text x="330" y="650" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >buzz</text><rect x="490" y="606" width="160" height="72" rx="0" fill="#1b2a3a" stroke="#111" stroke-width="2" /><text x="500" y="650" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >-</text><rect x="660" y="606" width="160" height="72" rx="0" fill="#1b2a3a" stroke="#111" stroke-width="2" /><text x="670" y="650" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >-</text><rect x="830" y="606" width="420" height="72" rx="0" fill="#1b2a3a" stroke="#111" stroke-width="2" /><text x="840" y="650" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >low, short, never harsh</text><rect x="1270" y="606" width="140" height="72" rx="0" fill="#1b2a3a" stroke="#111" stroke-width="2" /><text x="1280" y="650" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >150 ms</text><rect x="40" y="678" width="260" height="72" rx="0" fill="#16222f" stroke="#111" stroke-width="2" /><text x="50" y="722" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Purchase done</text><rect x="320" y="678" width="160" height="72" rx="0" fill="#16222f" stroke="#111" stroke-width="2" /><text x="330" y="722" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >tick</text><rect x="490" y="678" width="160" height="72" rx="0" fill="#16222f" stroke="#111" stroke-width="2" /><text x="500" y="722" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >chime</text><rect x="660" y="678" width="160" height="72" rx="0" fill="#16222f" stroke="#111" stroke-width="2" /><text x="670" y="722" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >coin</text><rect x="830" y="678" width="420" height="72" rx="0" fill="#16222f" stroke="#111" stroke-width="2" /><text x="840" y="722" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >clear confirm only</text><rect x="1270" y="678" width="140" height="72" rx="0" fill="#16222f" stroke="#111" stroke-width="2" /><text x="1280" y="722" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >400 ms</text><text x="40" y="800" font-size="19" fill="#cde" text-anchor="start" font-weight="normal" >Rarer or bigger moments add layers and length, not just volume. Duck music 3 dB under big stingers. Mute and volume sliders always work.</text><text x="40" y="835" font-size="19" fill="#9aa" text-anchor="start" font-weight="normal" >Rules: sound-feedback-map  satisfying-sfx  ui-sound-pairing  sound-groups-and-mixing</text>
</svg>