<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
<title>Playtime gift popup</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#2a1a1a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#7a2a2a" stroke-width="4"/></pattern></defs>
<rect width="1600" height="900" fill="#111"/>
<text x="40" y="56" font-size="38" fill="#fff" text-anchor="start" font-weight="bold" >Playtime gift popup</text><text x="40" y="92" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Small, honest, free. Appears over a corner and never blocks movement.</text><rect x="48" y="118" width="1024" height="494" rx="34" fill="#000" stroke="#444" stroke-width="4" /><rect x="60" y="130" width="1000" height="470" rx="14" fill="#1b2a3a" stroke="none" stroke-width="2" /><rect x="60" y="130" width="1000" height="470" rx="14" fill="#2b6b8f" stroke="none" stroke-width="2" /><rect x="60" y="430" width="1000" height="170" rx="0" fill="#4a8f3a" stroke="none" stroke-width="2" /><rect x="533.0" y="453.0" width="54.0" height="48.0" rx="4.8" fill="#3B82F6" stroke="#111" stroke-width="3" /><rect x="530.0" y="390.0" width="60" height="60" rx="7.199999999999999" fill="#FFD27F" stroke="#111" stroke-width="3" /><circle cx="548.0" cy="415.2" r="5.3999999999999995" fill="#111" stroke="none" stroke-width="2"/><circle cx="572.0" cy="415.2" r="5.3999999999999995" fill="#111" stroke="none" stroke-width="2"/><path d="M546.8,429.0 Q560,442.8 573.2,429.0" fill="none" stroke="#111" stroke-width="3" /><rect x="760" y="150" width="280" height="170" rx="16" fill="#14202c" stroke="#FFC83D" stroke-width="3" /><text x="900" y="185" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" >Playtime Gift</text><rect x="790" y="200" width="220" height="18" rx="9" fill="#334" stroke="none" stroke-width="2" /><rect x="790" y="200" width="150" height="18" rx="9" fill="#7CD86B" stroke="none" stroke-width="2" /><text x="900" y="246" font-size="17" fill="#cde" text-anchor="middle" font-weight="normal" >Next gift in 03:20</text><rect x="800" y="262" width="200" height="40" rx="10" fill="#2fb35a" stroke="none" stroke-width="2" /><text x="900" y="290" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold" >Claim 200 coins</text><rect x="60" y="130" width="1000" height="71" rx="0" fill="url(#hatch)" stroke="none" stroke-width="2" /><text x="560" y="172" font-size="16" fill="#f99" text-anchor="middle" font-weight="normal" >top bar, kept clear</text><circle cx="770" cy="160" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="770" y="166" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><circle cx="800" cy="209" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="800" y="215" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><circle cx="1005" cy="310" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1005" y="316" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><circle cx="560" cy="360" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="560" y="366" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >4</text><text x="1110" y="150" font-size="26" fill="#FFC83D" text-anchor="start" font-weight="bold" >Why this works</text><circle cx="1125" cy="186" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="192" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><text x="1150" y="192" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Corner card under the top bar, size of about</text><text x="1150" y="216" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >a quarter of the screen width.</text><circle cx="1125" cy="260" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="266" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><text x="1150" y="266" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Progress bar shows exactly when the next</text><text x="1150" y="290" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >gift lands.</text><circle cx="1125" cy="334" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="340" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><text x="1150" y="340" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Gift is a tap, not auto-spent. Player</text><text x="1150" y="364" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >chooses when.</text><circle cx="1125" cy="408" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="414" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >4</text><text x="1150" y="414" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Avatar and world stay playable. No full-</text><text x="1150" y="438" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >screen cover.</text><text x="40" y="660" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Gifts at fixed play minutes (for example 5, 10, 20, 30) reward time spent, not spending. Free, never gated by Robux.</text><text x="40" y="695" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Rules: session-length-levers  reward-moments-and-juice</text>
</svg>