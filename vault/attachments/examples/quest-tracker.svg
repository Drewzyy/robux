<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
<title>Quest tracker</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#2a1a1a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#7a2a2a" stroke-width="4"/></pattern></defs>
<rect width="1600" height="900" fill="#111"/>
<text x="40" y="56" font-size="38" fill="#fff" text-anchor="start" font-weight="bold" >Quest tracker</text><text x="40" y="92" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >One main quest pinned, two side quests collapsed, always a visible next reward.</text><rect x="48" y="118" width="1024" height="494" rx="34" fill="#000" stroke="#444" stroke-width="4" /><rect x="60" y="130" width="1000" height="470" rx="14" fill="#1b2a3a" stroke="none" stroke-width="2" /><rect x="60" y="130" width="1000" height="470" rx="14" fill="#2b6b8f" stroke="none" stroke-width="2" /><rect x="60" y="430" width="1000" height="170" rx="0" fill="#4a8f3a" stroke="none" stroke-width="2" /><rect x="673.0" y="453.0" width="54.0" height="48.0" rx="4.8" fill="#3B82F6" stroke="#111" stroke-width="3" /><rect x="670.0" y="390.0" width="60" height="60" rx="7.199999999999999" fill="#FFD27F" stroke="#111" stroke-width="3" /><circle cx="688.0" cy="415.2" r="5.3999999999999995" fill="#111" stroke="none" stroke-width="2"/><circle cx="712.0" cy="415.2" r="5.3999999999999995" fill="#111" stroke="none" stroke-width="2"/><path d="M686.8,429.0 Q700,442.8 713.2,429.0" fill="none" stroke="#111" stroke-width="3" /><rect x="60" y="130" width="1000" height="71" rx="0" fill="url(#hatch)" stroke="none" stroke-width="2" /><rect x="80" y="215" width="330" height="250" rx="14" fill="#000b" stroke="#fff" stroke-width="2" /><text x="100" y="248" font-size="16" fill="#FFC83D" text-anchor="start" font-weight="bold" >QUESTS</text><text x="100" y="282" font-size="22" fill="#fff" text-anchor="start" font-weight="bold" >Main: Clear the cave</text><rect x="100" y="296" width="290" height="18" rx="9" fill="#334" stroke="none" stroke-width="2" /><rect x="100" y="296" width="200" height="18" rx="9" fill="#7CD86B" stroke="none" stroke-width="2" /><text x="100" y="340" font-size="17" fill="#cde" text-anchor="start" font-weight="normal" >Slimes 7/10</text><text x="300" y="340" font-size="17" fill="#FFC83D" text-anchor="start" font-weight="normal" >Reward: 300</text><text x="100" y="385" font-size="17" fill="#cde" text-anchor="start" font-weight="normal" >Side: Find 3 mushrooms (1/3)</text><text x="100" y="420" font-size="17" fill="#cde" text-anchor="start" font-weight="normal" >Side: Visit the lighthouse</text><text x="100" y="452" font-size="15" fill="#9aa" text-anchor="start" font-weight="normal" >Tap a quest to see its path</text><path d="M410,300 C500,300 520,380 640,390" fill="none" stroke="#FFC83D" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#ar)"/><polygon points="660,379 676,395 660,411 644,395" fill="#FFC83D" stroke="#111" stroke-width="3"/><circle cx="90" cy="282" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="90" y="288" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><circle cx="110" cy="330" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="110" y="336" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><circle cx="75" cy="385" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="75" y="391" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><circle cx="560" cy="330" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="560" y="336" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >4</text><text x="1110" y="150" font-size="26" fill="#FFC83D" text-anchor="start" font-weight="bold" >Why this works</text><circle cx="1125" cy="186" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="192" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><text x="1150" y="192" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >One main quest, bigger than the rest.</text><circle cx="1125" cy="236" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="242" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><text x="1150" y="242" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Progress as a bar plus number: both</text><text x="1150" y="266" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >glanceable.</text><circle cx="1125" cy="310" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="316" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><text x="1150" y="316" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Side quests are one line each, not a wall of</text><text x="1150" y="340" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >text.</text><circle cx="1125" cy="384" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="390" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >4</text><text x="1150" y="390" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >A guide line points to the target so the</text><text x="1150" y="414" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >player never searches blindly.</text><text x="40" y="660" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Keep tracker under 30% of screen width, top-left under the top bar, collapsible. Max 3 visible entries.</text><text x="40" y="695" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Rules: quest-and-mission-design  hud-template</text>
</svg>