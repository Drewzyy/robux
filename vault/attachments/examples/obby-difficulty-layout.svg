<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
<title>Obby difficulty layout</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#2a1a1a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#7a2a2a" stroke-width="4"/></pattern></defs>
<rect width="1600" height="900" fill="#111"/>
<text x="40" y="56" font-size="38" fill="#fff" text-anchor="start" font-weight="bold" >Obby difficulty layout</text><text x="40" y="92" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Teach, test, twist, rest. A checkpoint every 4 to 6 jumps and a breather after each spike.</text><rect x="40" y="120" width="1520" height="700" rx="14" fill="#1c2430" stroke="none" stroke-width="2" /><line x1="100" y1="640" x2="250" y2="640" stroke="#445" stroke-width="6" stroke-dasharray="6 8"/><line x1="250" y1="640" x2="390" y2="560" stroke="#445" stroke-width="6" stroke-dasharray="6 8"/><line x1="390" y1="560" x2="500" y2="470" stroke="#445" stroke-width="6" stroke-dasharray="6 8"/><line x1="500" y1="470" x2="620" y2="520" stroke="#445" stroke-width="6" stroke-dasharray="6 8"/><line x1="620" y1="520" x2="760" y2="420" stroke="#445" stroke-width="6" stroke-dasharray="6 8"/><line x1="760" y1="420" x2="880" y2="340" stroke="#445" stroke-width="6" stroke-dasharray="6 8"/><line x1="880" y1="340" x2="1000" y2="380" stroke="#445" stroke-width="6" stroke-dasharray="6 8"/><line x1="1000" y1="380" x2="1120" y2="260" stroke="#445" stroke-width="6" stroke-dasharray="6 8"/><line x1="1120" y1="260" x2="1260" y2="200" stroke="#445" stroke-width="6" stroke-dasharray="6 8"/><line x1="1260" y1="200" x2="1400" y2="180" stroke="#445" stroke-width="6" stroke-dasharray="6 8"/><rect x="76.0" y="616.0" width="48" height="48" rx="6" fill="#7CD86B" stroke="#111" stroke-width="3" /><text x="100" y="646" font-size="20" fill="#111" text-anchor="middle" font-weight="bold" >1</text><rect x="226.0" y="616.0" width="48" height="48" rx="6" fill="#7CD86B" stroke="#111" stroke-width="3" /><text x="250" y="646" font-size="20" fill="#111" text-anchor="middle" font-weight="bold" >1</text><rect x="367.0" y="537.0" width="46" height="46" rx="6" fill="#B5D86B" stroke="#111" stroke-width="3" /><text x="390" y="566" font-size="20" fill="#111" text-anchor="middle" font-weight="bold" >2</text><rect x="477.0" y="447.0" width="46" height="46" rx="6" fill="#B5D86B" stroke="#111" stroke-width="3" /><text x="500" y="476" font-size="20" fill="#111" text-anchor="middle" font-weight="bold" >2</text><rect x="596.0" y="496.0" width="48" height="48" rx="6" fill="#7CD86B" stroke="#111" stroke-width="3" /><text x="620" y="526" font-size="20" fill="#111" text-anchor="middle" font-weight="bold" >1</text><rect x="738.0" y="398.0" width="44" height="44" rx="6" fill="#F0E442" stroke="#111" stroke-width="3" /><text x="760" y="426" font-size="20" fill="#111" text-anchor="middle" font-weight="bold" >3</text><rect x="859.0" y="319.0" width="42" height="42" rx="6" fill="#E69F00" stroke="#111" stroke-width="3" /><text x="880" y="346" font-size="20" fill="#111" text-anchor="middle" font-weight="bold" >4</text><rect x="977.0" y="357.0" width="46" height="46" rx="6" fill="#B5D86B" stroke="#111" stroke-width="3" /><text x="1000" y="386" font-size="20" fill="#111" text-anchor="middle" font-weight="bold" >2</text><rect x="1100.0" y="240.0" width="40" height="40" rx="6" fill="#E69F00" stroke="#111" stroke-width="3" /><text x="1120" y="266" font-size="20" fill="#111" text-anchor="middle" font-weight="bold" >5</text><rect x="1241.0" y="181.0" width="38" height="38" rx="6" fill="#D55E00" stroke="#111" stroke-width="3" /><text x="1260" y="206" font-size="20" fill="#111" text-anchor="middle" font-weight="bold" >6</text><rect x="1382.0" y="162.0" width="36" height="36" rx="6" fill="#D55E00" stroke="#111" stroke-width="3" /><text x="1400" y="186" font-size="20" fill="#111" text-anchor="middle" font-weight="bold" >7</text><line x1="500" y1="410" x2="500" y2="440" stroke="#fff" stroke-width="3" /><path d="M500,410 l36,10 l-36,10 z" fill="#56B4E9" stroke="#fff" stroke-width="2" /><line x1="1000" y1="320" x2="1000" y2="350" stroke="#fff" stroke-width="3" /><path d="M1000,320 l36,10 l-36,10 z" fill="#56B4E9" stroke="#fff" stroke-width="2" /><line x1="1400" y1="120" x2="1400" y2="150" stroke="#fff" stroke-width="3" /><path d="M1400,120 l36,10 l-36,10 z" fill="#56B4E9" stroke="#fff" stroke-width="2" /><text x="100" y="700" font-size="22" fill="#fff" text-anchor="start" font-weight="bold" >START</text><text x="1400" y="150" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" >FINISH</text><rect x="40" y="780" width="1520" height="30" rx="0" fill="#223" stroke="none" stroke-width="2" /><rect x="40" y="780" width="190" height="30" rx="0" fill="#7CD86B" stroke="none" stroke-width="2" /><rect x="230" y="780" width="190" height="30" rx="0" fill="#B5D86B" stroke="none" stroke-width="2" /><rect x="420" y="780" width="190" height="30" rx="0" fill="#F0E442" stroke="none" stroke-width="2" /><rect x="610" y="780" width="190" height="30" rx="0" fill="#E69F00" stroke="none" stroke-width="2" /><rect x="800" y="780" width="190" height="30" rx="0" fill="#E69F00" stroke="none" stroke-width="2" /><rect x="990" y="780" width="190" height="30" rx="0" fill="#D55E00" stroke="none" stroke-width="2" /><rect x="1180" y="780" width="190" height="30" rx="0" fill="#D55E00" stroke="none" stroke-width="2" /><rect x="1370" y="780" width="190" height="30" rx="0" fill="#D55E00" stroke="none" stroke-width="2" /><text x="60" y="802" font-size="16" fill="#111" text-anchor="start" font-weight="normal" >difficulty rising, number in each pad = 1 to 7</text><circle cx="250" cy="590" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="250" y="596" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><circle cx="620" cy="470" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="620" y="476" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><circle cx="500" cy="420" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="500" y="426" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><circle cx="1000" cy="325" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1000" y="331" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >4</text><circle cx="1260" cy="150" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1260" y="156" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >5</text><text x="40" y="160" font-size="26" fill="#FFC83D" text-anchor="start" font-weight="bold" >Why this works</text><circle cx="55" cy="196" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="55" y="202" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><text x="80" y="202" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Stages 1 to 2: teach one jump type in a</text><text x="80" y="226" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >safe place.</text><circle cx="55" cy="264" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="55" y="270" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><text x="80" y="270" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Stage 5 drops to 1 after the stage 4</text><text x="80" y="294" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >test: a breather, not a ramp wall.</text><circle cx="55" cy="332" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="55" y="338" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><text x="80" y="338" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Checkpoint flag (blue) before each spike</text><text x="80" y="362" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >so failure costs seconds, not minutes.</text><circle cx="55" cy="400" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="55" y="406" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >4</text><text x="80" y="406" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Hard stage 7 comes after a flag, so a</text><text x="80" y="430" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >retry feels fair.</text><circle cx="55" cy="468" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="55" y="474" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >5</text><text x="80" y="474" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Finish has the biggest reward and a</text><text x="80" y="498" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >clear visible goal from far away.</text><text x="1000" y="500" font-size="19" fill="#9aa" text-anchor="start" font-weight="normal" >Rules: difficulty-and-flow</text><text x="1000" y="530" font-size="19" fill="#9aa" text-anchor="start" font-weight="normal" >Never place the hardest jump at the start.</text>
</svg>