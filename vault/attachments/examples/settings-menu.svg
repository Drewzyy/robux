<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
<title>Settings menu</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#2a1a1a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#7a2a2a" stroke-width="4"/></pattern></defs>
<rect width="1600" height="900" fill="#111"/>
<text x="40" y="56" font-size="38" fill="#fff" text-anchor="start" font-weight="bold" >Settings menu</text><text x="40" y="92" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Short, grouped, every toggle visible without scrolling on a phone.</text><rect x="48" y="118" width="1024" height="494" rx="34" fill="#000" stroke="#444" stroke-width="4" /><rect x="60" y="130" width="1000" height="470" rx="14" fill="#1b2a3a" stroke="none" stroke-width="2" /><rect x="60" y="130" width="1000" height="470" rx="14" fill="#14202c" stroke="none" stroke-width="2" /><text x="90" y="178" font-size="32" fill="#fff" text-anchor="start" font-weight="bold" >Settings</text><rect x="985" y="140" width="60" height="60" rx="12" fill="#d44" stroke="#fff" stroke-width="3" /><text x="1015" y="182" font-size="32" fill="#fff" text-anchor="middle" font-weight="bold" >X</text><text x="90" y="235" font-size="24" fill="#FFC83D" text-anchor="start" font-weight="bold" >Audio</text><line x1="90" y1="248" x2="380" y2="248" stroke="#445" stroke-width="2" /><text x="90" y="292" font-size="20" fill="#fff" text-anchor="start" font-weight="normal" >Music volume</text><rect x="90" y="308" width="200" height="12" rx="6" fill="#334" stroke="none" stroke-width="2" /><rect x="90" y="308" width="140" height="12" rx="6" fill="#56B4E9" stroke="none" stroke-width="2" /><circle cx="230" cy="314" r="12" fill="#fff" stroke="none" stroke-width="2"/><text x="90" y="402" font-size="20" fill="#fff" text-anchor="start" font-weight="normal" >Sound effects</text><rect x="90" y="418" width="200" height="12" rx="6" fill="#334" stroke="none" stroke-width="2" /><rect x="90" y="418" width="170" height="12" rx="6" fill="#56B4E9" stroke="none" stroke-width="2" /><circle cx="260" cy="424" r="12" fill="#fff" stroke="none" stroke-width="2"/><text x="410" y="235" font-size="24" fill="#FFC83D" text-anchor="start" font-weight="bold" >Comfort</text><line x1="410" y1="248" x2="700" y2="248" stroke="#445" stroke-width="2" /><text x="410" y="292" font-size="20" fill="#fff" text-anchor="start" font-weight="normal" >Screen shake</text><rect x="610" y="304" width="90" height="40" rx="20" fill="#555" stroke="none" stroke-width="2" /><circle cx="630" cy="324" r="16" fill="#fff" stroke="none" stroke-width="2"/><text x="596" y="332" font-size="16" fill="#cde" text-anchor="end" font-weight="normal" >OFF</text><text x="410" y="402" font-size="20" fill="#fff" text-anchor="start" font-weight="normal" >Reduced motion</text><rect x="610" y="414" width="90" height="40" rx="20" fill="#2fb35a" stroke="none" stroke-width="2" /><circle cx="680" cy="434" r="16" fill="#fff" stroke="none" stroke-width="2"/><text x="596" y="442" font-size="16" fill="#cde" text-anchor="end" font-weight="normal" >ON</text><text x="730" y="235" font-size="24" fill="#FFC83D" text-anchor="start" font-weight="bold" >Controls</text><line x1="730" y1="248" x2="1020" y2="248" stroke="#445" stroke-width="2" /><text x="730" y="292" font-size="20" fill="#fff" text-anchor="start" font-weight="normal" >Camera sensitivity</text><rect x="930" y="304" width="90" height="40" rx="20" fill="#2fb35a" stroke="none" stroke-width="2" /><circle cx="1000" cy="324" r="16" fill="#fff" stroke="none" stroke-width="2"/><text x="916" y="332" font-size="16" fill="#cde" text-anchor="end" font-weight="normal" >ON</text><text x="730" y="402" font-size="20" fill="#fff" text-anchor="start" font-weight="normal" >Show tips</text><rect x="930" y="414" width="90" height="40" rx="20" fill="#2fb35a" stroke="none" stroke-width="2" /><circle cx="1000" cy="434" r="16" fill="#fff" stroke="none" stroke-width="2"/><text x="916" y="442" font-size="16" fill="#cde" text-anchor="end" font-weight="normal" >ON</text><rect x="90" y="520" width="200" height="52" rx="10" fill="#555" stroke="none" stroke-width="2" /><text x="190" y="554" font-size="19" fill="#fff" text-anchor="middle" font-weight="normal" >Reset to default</text><circle cx="90" cy="222" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="90" y="228" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><circle cx="560" cy="330" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="560" y="336" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><circle cx="990" cy="300" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="990" y="306" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><text x="1110" y="150" font-size="26" fill="#FFC83D" text-anchor="start" font-weight="bold" >Why this works</text><circle cx="1125" cy="186" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="192" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><text x="1150" y="192" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Group by purpose with three headers, no deep</text><text x="1150" y="216" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >menus.</text><circle cx="1125" cy="260" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="266" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><text x="1150" y="266" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Comfort section: screen shake and reduced</text><text x="1150" y="290" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >motion toggles. Accessibility is not</text><text x="1150" y="314" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >optional.</text><circle cx="1125" cy="358" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="364" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><text x="1150" y="364" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Sliders and toggles are 40 px tall, thumb</text><text x="1150" y="388" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >friendly, and state is written out (ON, OFF)</text><text x="1150" y="412" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >not colour only.</text><text x="40" y="660" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Settings save per player and apply instantly with no confirm button.</text><text x="40" y="695" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Rules: accessibility  audio-settings-menu  mobile-first-checklist</text>
</svg>