<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
<title>Good HUD on a phone</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#2a1a1a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#7a2a2a" stroke-width="4"/></pattern></defs>
<rect width="1600" height="900" fill="#111"/>
<text x="40" y="56" font-size="38" fill="#fff" text-anchor="start" font-weight="bold" >Good HUD on a phone</text><text x="40" y="92" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Objective, currency, progress and next reward sit in the top third. Thumb zones stay empty.</text><rect x="40" y="130" width="1040" height="468" rx="14" fill="#2b6b8f" stroke="none" stroke-width="2" /><rect x="40" y="420.16" width="1040" height="177.84" rx="0" fill="#4a8f3a" stroke="none" stroke-width="2" /><rect x="533.0" y="420.40000000000003" width="54.0" height="48.0" rx="4.8" fill="#3B82F6" stroke="#111" stroke-width="3" /><rect x="530.0" y="357.40000000000003" width="60" height="60" rx="7.199999999999999" fill="#FFD27F" stroke="#111" stroke-width="3" /><circle cx="548.0" cy="382.6" r="5.3999999999999995" fill="#111" stroke="none" stroke-width="2"/><circle cx="572.0" cy="382.6" r="5.3999999999999995" fill="#111" stroke="none" stroke-width="2"/><path d="M546.8,396.40000000000003 Q560.0,410.20000000000005 573.2,396.40000000000003" fill="none" stroke="#111" stroke-width="3" /><rect x="40" y="457.59999999999997" width="312.0" height="140.4" rx="0" fill="#fff" stroke="none" stroke-width="0" opacity="0.10"/><rect x="820.0" y="457.59999999999997" width="260.0" height="140.4" rx="0" fill="#fff" stroke="none" stroke-width="0" opacity="0.10"/><text x="60" y="586" font-size="16" fill="#cde" text-anchor="start" font-weight="normal" >thumb zone: joystick</text><text x="1060" y="586" font-size="16" fill="#cde" text-anchor="end" font-weight="normal" >thumb zone: jump</text><rect x="40" y="130" width="1040" height="71" rx="0" fill="url(#hatch)" stroke="none" stroke-width="2" /><text x="560.0" y="174" font-size="18" fill="#f99" text-anchor="middle" font-weight="normal" >Roblox top bar: 58 px, keep clear</text><rect x="60" y="214" width="300" height="64" rx="12" fill="#000a" stroke="#fff" stroke-width="2" /><text x="74" y="240" font-size="14" fill="#FFC83D" text-anchor="start" font-weight="normal" >OBJECTIVE</text><text x="74" y="266" font-size="20" fill="#fff" text-anchor="start" font-weight="normal" >Collect 10 crystals (6/10)</text><rect x="880" y="214" width="180" height="44" rx="22" fill="#000a" stroke="#FFC83D" stroke-width="2" /><circle cx="904" cy="236" r="14" fill="#FFC83D" stroke="#B8860B" stroke-width="3"/><text x="904" y="240.9" font-size="15.400000000000002" fill="#8a5a00" text-anchor="middle" font-weight="bold" >$</text><text x="930" y="244" font-size="24" fill="#FFC83D" text-anchor="start" font-weight="bold" >1,250</text><rect x="410" y="220" width="300" height="26" rx="13" fill="#000a" stroke="#fff" stroke-width="2" /><rect x="412" y="222" width="176" height="22" rx="11" fill="#7CD86B" stroke="none" stroke-width="2" /><text x="560" y="274" font-size="16" fill="#cde" text-anchor="middle" font-weight="normal" >60% to Zone 2</text><rect x="880" y="268" width="180" height="36" rx="10" fill="#000a" stroke="none" stroke-width="2" /><text x="970" y="293" font-size="15" fill="#cde" text-anchor="middle" font-weight="normal" >Next: Pet egg at 10</text><circle cx="150" cy="508" r="50" fill="#fff3" stroke="#fff" stroke-width="3"/><circle cx="980" cy="508" r="42" fill="#fff4" stroke="#fff" stroke-width="3"/><circle cx="380" cy="208" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="380" y="214" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><circle cx="870" cy="210" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="870" y="216" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><circle cx="730" cy="230" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="730" y="236" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><circle cx="870" cy="298" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="870" y="304" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >4</text><circle cx="230" cy="438" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="230" y="444" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >5</text><text x="1120" y="150" font-size="26" fill="#FFC83D" text-anchor="start" font-weight="bold" >Why this works</text><circle cx="1135" cy="186" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1135" y="192" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><text x="1160" y="192" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Objective top-left, below the top bar: the</text><text x="1160" y="216" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >player always knows what to do.</text><circle cx="1135" cy="260" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1135" y="266" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><text x="1160" y="266" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Currency top-right inside the safe inset;</text><text x="1160" y="290" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >every reward lands here.</text><circle cx="1135" cy="334" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1135" y="340" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><text x="1160" y="340" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Progress bar nearby: goal gradient pulls the</text><text x="1160" y="364" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >player to finish.</text><circle cx="1135" cy="408" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1135" y="414" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >4</text><text x="1160" y="414" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Next reward is an open loop that says why to</text><text x="1160" y="438" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >keep going.</text><circle cx="1135" cy="482" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1135" y="488" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >5</text><text x="1160" y="488" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Bottom 30% left free for joystick and jump.</text><text x="1160" y="512" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Nothing critical there.</text><text x="40" y="650" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Rules: hud-template  mobile-first-checklist</text><text x="40" y="690" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Text 16+ px, high contrast, 4 core elements only in minute one. Add more HUD only when the player meets the feature.</text>
</svg>