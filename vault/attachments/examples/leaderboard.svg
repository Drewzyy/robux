<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
<title>Leaderboard</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#2a1a1a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#7a2a2a" stroke-width="4"/></pattern></defs>
<rect width="1600" height="900" fill="#111"/>
<text x="40" y="56" font-size="38" fill="#fff" text-anchor="start" font-weight="bold" >Leaderboard</text><text x="40" y="92" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Show the top 5, then YOU and the player just above you. A near goal beats a distant one.</text><rect x="40" y="130" width="760" height="700" rx="18" fill="#14202c" stroke="#445" stroke-width="3" /><text x="70" y="175" font-size="28" fill="#fff" text-anchor="start" font-weight="bold" >Top Collectors, this week</text><rect x="60" y="200" width="720" height="54" rx="10" fill="#1f3347" stroke="none" stroke-width="2" /><text x="90" y="236" font-size="26" fill="#FFC83D" text-anchor="start" font-weight="bold" >1</text><circle cx="150" cy="227" r="18" fill="#56B4E9" stroke="none" stroke-width="2"/><text x="185" y="235" font-size="22" fill="#fff" text-anchor="start" font-weight="normal" >Skyfox</text><text x="750" y="235" font-size="22" fill="#FFC83D" text-anchor="end" font-weight="bold" >98,400</text><rect x="60" y="262" width="720" height="54" rx="10" fill="#1f3347" stroke="none" stroke-width="2" /><text x="90" y="298" font-size="26" fill="#ccc" text-anchor="start" font-weight="bold" >2</text><circle cx="150" cy="289" r="18" fill="#56B4E9" stroke="none" stroke-width="2"/><text x="185" y="297" font-size="22" fill="#fff" text-anchor="start" font-weight="normal" >BlueMoss</text><text x="750" y="297" font-size="22" fill="#FFC83D" text-anchor="end" font-weight="bold" >91,250</text><rect x="60" y="324" width="720" height="54" rx="10" fill="#1f3347" stroke="none" stroke-width="2" /><text x="90" y="360" font-size="26" fill="#CD7F32" text-anchor="start" font-weight="bold" >3</text><circle cx="150" cy="351" r="18" fill="#56B4E9" stroke="none" stroke-width="2"/><text x="185" y="359" font-size="22" fill="#fff" text-anchor="start" font-weight="normal" >RocketPea</text><text x="750" y="359" font-size="22" fill="#FFC83D" text-anchor="end" font-weight="bold" >87,900</text><rect x="60" y="386" width="720" height="54" rx="10" fill="#1f3347" stroke="none" stroke-width="2" /><text x="90" y="422" font-size="26" fill="#9aa" text-anchor="start" font-weight="bold" >4</text><circle cx="150" cy="413" r="18" fill="#56B4E9" stroke="none" stroke-width="2"/><text x="185" y="421" font-size="22" fill="#fff" text-anchor="start" font-weight="normal" >MapleJay</text><text x="750" y="421" font-size="22" fill="#FFC83D" text-anchor="end" font-weight="bold" >80,100</text><rect x="60" y="448" width="720" height="54" rx="10" fill="#1f3347" stroke="none" stroke-width="2" /><text x="90" y="484" font-size="26" fill="#9aa" text-anchor="start" font-weight="bold" >5</text><circle cx="150" cy="475" r="18" fill="#56B4E9" stroke="none" stroke-width="2"/><text x="185" y="483" font-size="22" fill="#fff" text-anchor="start" font-weight="normal" >NovaBun</text><text x="750" y="483" font-size="22" fill="#FFC83D" text-anchor="end" font-weight="bold" >76,320</text><text x="420" y="530" font-size="28" fill="#9aa" text-anchor="middle" font-weight="normal" >. . .</text><rect x="60" y="550" width="720" height="54" rx="10" fill="#1f3347" stroke="none" stroke-width="3" /><text x="90" y="586" font-size="26" fill="#9aa" text-anchor="start" font-weight="bold" >41</text><circle cx="150" cy="577" r="18" fill="#56B4E9" stroke="none" stroke-width="2"/><text x="185" y="585" font-size="22" fill="#fff" text-anchor="start" font-weight="normal" >TinyOtter</text><text x="750" y="585" font-size="22" fill="#FFC83D" text-anchor="end" font-weight="bold" >12,980</text><rect x="60" y="612" width="720" height="54" rx="10" fill="#2f5a3c" stroke="#7CD86B" stroke-width="3" /><text x="90" y="648" font-size="26" fill="#9aa" text-anchor="start" font-weight="bold" >42</text><circle cx="150" cy="639" r="18" fill="#7CD86B" stroke="none" stroke-width="2"/><text x="185" y="647" font-size="22" fill="#fff" text-anchor="start" font-weight="bold" >You</text><text x="750" y="647" font-size="22" fill="#FFC83D" text-anchor="end" font-weight="bold" >12,410</text><rect x="60" y="674" width="720" height="54" rx="10" fill="#1f3347" stroke="none" stroke-width="3" /><text x="90" y="710" font-size="26" fill="#9aa" text-anchor="start" font-weight="bold" >43</text><circle cx="150" cy="701" r="18" fill="#56B4E9" stroke="none" stroke-width="2"/><text x="185" y="709" font-size="22" fill="#fff" text-anchor="start" font-weight="normal" >PlumFox</text><text x="750" y="709" font-size="22" fill="#FFC83D" text-anchor="end" font-weight="bold" >12,300</text><circle cx="40" cy="230" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="40" y="236" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><circle cx="40" cy="606" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="40" y="612" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><circle cx="790" cy="606" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="790" y="612" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><text x="860" y="150" font-size="26" fill="#FFC83D" text-anchor="start" font-weight="bold" >Why this works</text><circle cx="875" cy="186" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="875" y="192" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><text x="900" y="192" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Top 5 gives something to aspire to, in</text><text x="900" y="216" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >one glance.</text><circle cx="875" cy="286" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="875" y="292" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><text x="900" y="292" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Your own row is highlighted and sits</text><text x="900" y="316" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >between neighbours. You see who to</text><text x="900" y="340" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >pass.</text><circle cx="875" cy="410" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="875" y="416" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><text x="900" y="416" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Gap to the next rank is readable:</text><text x="900" y="440" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >12,410 vs 12,980 is close, so pushing</text><text x="900" y="464" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >feels worth it.</text><circle cx="875" cy="534" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="875" y="540" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >4</text><text x="900" y="540" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Weekly reset gives new players a fresh</text><text x="900" y="564" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >chance.</text><circle cx="875" cy="634" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="875" y="640" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >5</text><text x="900" y="640" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Names come from Roblox display names.</text><text x="900" y="664" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >No private data shown.</text><text x="860" y="720" font-size="19" fill="#9aa" text-anchor="start" font-weight="normal" >Rank by effort players can control. Avoid boards that only reward spending.</text><text x="860" y="750" font-size="19" fill="#9aa" text-anchor="start" font-weight="normal" >Rules: social-retention  collection-and-completion</text>
</svg>