<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
<title>Retention loop stack</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#2a1a1a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#7a2a2a" stroke-width="4"/></pattern></defs>
<rect width="1600" height="900" fill="#111"/>
<text x="40" y="56" font-size="38" fill="#fff" text-anchor="start" font-weight="bold" >Retention loop stack</text><text x="40" y="92" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Loops nest: seconds, session, day, week, long term. Each layer gives a reason to come back to the next.</text><rect x="250" y="140" width="1100" height="110" rx="14" fill="#CC79A7" stroke="#111" stroke-width="3" /><text x="300" y="188" font-size="32" fill="#111" text-anchor="start" font-weight="bold" >Long term (months)</text><text x="300" y="226" font-size="22" fill="#111" text-anchor="start" font-weight="normal" >collections, rank, rebirth, updates</text><rect x="250" y="265" width="1100" height="110" rx="14" fill="#E69F00" stroke="#111" stroke-width="3" /><text x="300" y="313" font-size="32" fill="#111" text-anchor="start" font-weight="bold" >Weekly</text><text x="300" y="351" font-size="22" fill="#111" text-anchor="start" font-weight="normal" >events, leaderboard reset, limited cosmetics</text><rect x="250" y="390" width="1100" height="110" rx="14" fill="#56B4E9" stroke="#111" stroke-width="3" /><text x="300" y="438" font-size="32" fill="#111" text-anchor="start" font-weight="bold" >Daily</text><text x="300" y="476" font-size="22" fill="#111" text-anchor="start" font-weight="normal" >daily reward, quests, streak</text><rect x="250" y="515" width="1100" height="110" rx="14" fill="#7CD86B" stroke="#111" stroke-width="3" /><text x="300" y="563" font-size="32" fill="#111" text-anchor="start" font-weight="bold" >Session (5 to 20 min)</text><text x="300" y="601" font-size="22" fill="#111" text-anchor="start" font-weight="normal" >goals, timed gifts, next zone</text><rect x="250" y="640" width="1100" height="110" rx="14" fill="#FF7A59" stroke="#111" stroke-width="3" /><text x="300" y="688" font-size="32" fill="#111" text-anchor="start" font-weight="bold" >Core loop (seconds)</text><text x="300" y="726" font-size="22" fill="#111" text-anchor="start" font-weight="normal" >do, earn, spend, grow</text><line x1="160" y1="740" x2="160" y2="160" stroke="#fff" stroke-width="4" marker-end="url(#ar)"/><text x="100" y="460" font-size="16" fill="#9aa" text-anchor="middle" font-weight="normal" transform="rotate(-90 100 460)">longer</text><text x="1400" y="200" font-size="22" fill="#FFC83D" text-anchor="start" font-weight="bold" >Build bottom up.</text><text x="1400" y="232" font-size="18" fill="#ddd" text-anchor="start" font-weight="normal" >A weak core loop</text><text x="1400" y="258" font-size="18" fill="#ddd" text-anchor="start" font-weight="normal" >cannot be saved by</text><text x="1400" y="284" font-size="18" fill="#ddd" text-anchor="start" font-weight="normal" >a daily reward.</text><text x="1400" y="340" font-size="18" fill="#ddd" text-anchor="start" font-weight="normal" >Rewards are free,</text><text x="1400" y="366" font-size="18" fill="#ddd" text-anchor="start" font-weight="normal" >honest and kind.</text><text x="1400" y="392" font-size="18" fill="#ddd" text-anchor="start" font-weight="normal" >No guilt, no fake</text><text x="1400" y="418" font-size="18" fill="#ddd" text-anchor="start" font-weight="normal" >timers, no pressure</text><text x="1400" y="444" font-size="18" fill="#ddd" text-anchor="start" font-weight="normal" >on children.</text><text x="40" y="850" font-size="19" fill="#9aa" text-anchor="start" font-weight="normal" >Rules: loop-stack  day-1-day-7-day-30-playbook  session-length-levers</text>
</svg>