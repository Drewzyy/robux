<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
<title>Lobby hub map</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#2a1a1a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#7a2a2a" stroke-width="4"/></pattern></defs>
<rect width="1600" height="900" fill="#111"/>
<text x="40" y="56" font-size="38" fill="#fff" text-anchor="start" font-weight="bold" >Lobby hub map, top-down</text><text x="40" y="92" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Radial hub: spawn in the middle, 4 spokes, one tall landmark per spoke, loop road between them.</text><rect x="40" y="120" width="1040" height="720" rx="14" fill="#243a24" stroke="none" stroke-width="2" /><circle cx="560" cy="500" r="300" fill="none" stroke="#bda46a" opacity="0.6" stroke-width="30"/><line x1="560" y1="500" x2="560.0" y2="170.0" stroke="#bda46a" stroke-width="36" /><rect x="475.0" y="165.0" width="170" height="90" rx="12" fill="#FF7A59" stroke="#111" stroke-width="3" /><text x="560.0" y="218.0" font-size="26" fill="#111" text-anchor="middle" font-weight="bold" >Obby</text><polygon points="630.0,106.0 657.2,160.4 602.8,160.4" fill="#FF7A59" stroke="#111" stroke-width="3"/><line x1="560" y1="500" x2="960.0" y2="500.0" stroke="#bda46a" stroke-width="36" /><rect x="820.0" y="455.0" width="170" height="90" rx="12" fill="#56B4E9" stroke="#111" stroke-width="3" /><text x="905.0" y="508.0" font-size="26" fill="#111" text-anchor="middle" font-weight="bold" >Shop</text><polygon points="905.0,396.0 932.2,450.4 877.8,450.4" fill="#56B4E9" stroke="#111" stroke-width="3"/><line x1="560" y1="500" x2="560.0" y2="830.0" stroke="#bda46a" stroke-width="36" /><rect x="475.0" y="745.0" width="170" height="90" rx="12" fill="#7CD86B" stroke="#111" stroke-width="3" /><text x="560.0" y="798.0" font-size="26" fill="#111" text-anchor="middle" font-weight="bold" >Simulator</text><polygon points="630.0,686.0 657.2,740.4 602.8,740.4" fill="#7CD86B" stroke="#111" stroke-width="3"/><line x1="560" y1="500" x2="160.0" y2="500.00000000000006" stroke="#bda46a" stroke-width="36" /><rect x="130.0" y="455.00000000000006" width="170" height="90" rx="12" fill="#CC79A7" stroke="#111" stroke-width="3" /><text x="215.0" y="508.00000000000006" font-size="26" fill="#111" text-anchor="middle" font-weight="bold" >Pets</text><polygon points="215.0,396.00000000000006 242.2,450.40000000000003 187.8,450.40000000000003" fill="#CC79A7" stroke="#111" stroke-width="3"/><circle cx="560" cy="500" r="90" fill="#bda46a" stroke="#111" stroke-width="4"/><polygon points="560.0,466.0 569.0,487.6 592.3,489.5 574.6,504.7 580.0,527.5 560.0,515.3 540.0,527.5 545.4,504.7 527.7,489.5 551.0,487.6" fill="#fff" stroke="#111" stroke-width="2"/><text x="560" y="630" font-size="18" fill="#fff" text-anchor="middle" font-weight="normal" >SPAWN plaza (12 studs to first NPC)</text><rect x="310" y="250" width="30" height="30" rx="4" fill="#7a5a3a" stroke="none" stroke-width="2" /><text x="325" y="244" font-size="14" fill="#ddd" text-anchor="middle" font-weight="normal" >NPC</text><circle cx="730" cy="460" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="730" y="466" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><circle cx="810" cy="640" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="810" y="646" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><circle cx="430" cy="310" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="430" y="316" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><circle cx="640" cy="280" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="640" y="286" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >4</text><circle cx="560" cy="740" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="560" y="746" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >5</text><text x="1110" y="140" font-size="26" fill="#FFC83D" text-anchor="start" font-weight="bold" >Why this works</text><circle cx="1125" cy="176" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="182" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><text x="1150" y="182" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Spawn plaza in the center: every spoke is</text><text x="1150" y="206" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >visible, so nobody is lost.</text><circle cx="1125" cy="250" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="256" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><text x="1150" y="256" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Main routes 16 to 24 studs wide so groups</text><text x="1150" y="280" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >pass without blocking.</text><circle cx="1125" cy="324" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="330" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><text x="1150" y="330" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Ring road lets players loop, never forced to</text><text x="1150" y="354" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >backtrack.</text><circle cx="1125" cy="398" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="404" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >4</text><text x="1150" y="404" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >One landmark per zone, visible from 100+</text><text x="1150" y="428" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >studs: triangles mark them here.</text><circle cx="1125" cy="472" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="478" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >5</text><text x="1150" y="478" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >First interactive object within 30 studs,</text><text x="1150" y="502" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >first goal within 15 s of walking.</text><text x="1110" y="700" font-size="19" fill="#9aa" text-anchor="start" font-weight="normal" >Walk time between key points: 20 to 40 s.</text><text x="1110" y="730" font-size="19" fill="#9aa" text-anchor="start" font-weight="normal" >Longer: add a teleport pad.</text><text x="1110" y="780" font-size="19" fill="#9aa" text-anchor="start" font-weight="normal" >Rules: world-and-level-design</text>
</svg>