<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
<title>Bad shop screen</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#2a1a1a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#7a2a2a" stroke-width="4"/></pattern></defs>
<rect width="1600" height="900" fill="#111"/>
<text x="40" y="56" font-size="38" fill="#fff" text-anchor="start" font-weight="bold" >Bad shop screen</text><text x="40" y="92" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Hidden prices, hidden odds, pressure timer, tiny close. Never do this, especially for kids.</text><rect x="48" y="118" width="1024" height="494" rx="34" fill="#000" stroke="#444" stroke-width="4" /><rect x="60" y="130" width="1000" height="470" rx="14" fill="#1b2a3a" stroke="none" stroke-width="2" /><rect x="60" y="130" width="1000" height="470" rx="14" fill="#401020" stroke="none" stroke-width="2" /><text x="560" y="185" font-size="34" fill="#ff0" text-anchor="middle" font-weight="bold" >MEGA DEAL!!! ONLY 00:07 LEFT!!!</text><rect x="1040" y="135" width="12" height="12" rx="1" fill="#555" stroke="none" stroke-width="2" /><rect x="90" y="215" width="215" height="270" rx="14" fill="#802040" stroke="#ff0" stroke-width="3" /><text x="197" y="350" font-size="50" fill="#fff" text-anchor="middle" font-weight="bold" >???</text><rect x="110" y="430" width="175" height="44" rx="8" fill="#e22" stroke="none" stroke-width="2" /><text x="197" y="460" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" >GRAB IT</text><rect x="325" y="215" width="215" height="270" rx="14" fill="#802040" stroke="#ff0" stroke-width="3" /><text x="432" y="350" font-size="50" fill="#fff" text-anchor="middle" font-weight="bold" >???</text><rect x="345" y="430" width="175" height="44" rx="8" fill="#e22" stroke="none" stroke-width="2" /><text x="432" y="460" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" >GRAB IT</text><rect x="560" y="215" width="215" height="270" rx="14" fill="#802040" stroke="#ff0" stroke-width="3" /><text x="667" y="350" font-size="50" fill="#fff" text-anchor="middle" font-weight="bold" >???</text><rect x="580" y="430" width="175" height="44" rx="8" fill="#e22" stroke="none" stroke-width="2" /><text x="667" y="460" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" >GRAB IT</text><rect x="795" y="215" width="215" height="270" rx="14" fill="#802040" stroke="#ff0" stroke-width="3" /><text x="902" y="350" font-size="50" fill="#fff" text-anchor="middle" font-weight="bold" >???</text><rect x="815" y="430" width="175" height="44" rx="8" fill="#e22" stroke="none" stroke-width="2" /><text x="902" y="460" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" >GRAB IT</text><rect x="90" y="500" width="940" height="70" rx="10" fill="#fff" stroke="none" stroke-width="2" /><text x="560" y="545" font-size="22" fill="#c00" text-anchor="middle" font-weight="bold" >EVERYONE IS BUYING! Don't miss out, your friends already did!</text><circle cx="560" cy="190" r="15" fill="#f66" stroke="#111" stroke-width="2"/><text x="560" y="196" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><circle cx="1046" cy="141" r="15" fill="#f66" stroke="#111" stroke-width="2"/><text x="1046" y="147" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><circle cx="197" cy="350" r="15" fill="#f66" stroke="#111" stroke-width="2"/><text x="197" y="356" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><circle cx="560" cy="530" r="15" fill="#f66" stroke="#111" stroke-width="2"/><text x="560" y="536" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >4</text><text x="1110" y="150" font-size="26" fill="#f66" text-anchor="start" font-weight="bold" >What is wrong</text><circle cx="1125" cy="186" r="15" fill="#f66" stroke="#111" stroke-width="2"/><text x="1125" y="192" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><text x="1150" y="192" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Fake countdown pressures kids to pay now.</text><circle cx="1125" cy="236" r="15" fill="#f66" stroke="#111" stroke-width="2"/><text x="1125" y="242" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><text x="1150" y="242" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Close box is 12 px: players mis-tap into</text><text x="1150" y="266" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >purchases.</text><circle cx="1125" cy="310" r="15" fill="#f66" stroke="#111" stroke-width="2"/><text x="1125" y="316" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><text x="1150" y="316" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >No price, no item name, no odds. Trust gone.</text><circle cx="1125" cy="360" r="15" fill="#f66" stroke="#111" stroke-width="2"/><text x="1125" y="366" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >4</text><text x="1150" y="366" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Shame and peer pressure copy. Not allowed in</text><text x="1150" y="390" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >our games.</text><text x="40" y="660" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Also wrong: shop that pops on join or after death, covers the play area, or starts a purchase without a clear tap on a labelled button.</text>
</svg>