<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
<title>Reward reveal sequence</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#2a1a1a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#7a2a2a" stroke-width="4"/></pattern></defs>
<rect width="1600" height="900" fill="#111"/>
<text x="40" y="56" font-size="38" fill="#fff" text-anchor="start" font-weight="bold" >Reward reveal: 4 beats</text><text x="40" y="92" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Anticipation, reveal, celebration, collection. Rare reward total about 5 s, with Skip after 2 s.</text><rect x="40" y="130" width="360" height="420" rx="14" fill="#1b2a3a" stroke="#445" stroke-width="2" /><text x="220" y="170" font-size="26" fill="#FFC83D" text-anchor="middle" font-weight="bold" >1 Anticipation</text><text x="220" y="200" font-size="18" fill="#9aa" text-anchor="middle" font-weight="normal" >1.2 s</text><rect x="150" y="270" width="140" height="110" rx="10" fill="#8a5a2a" stroke="#111" stroke-width="3" /><rect x="150" y="250" width="140" height="40" rx="10" fill="#a8702e" stroke="#111" stroke-width="3" /><rect x="205" y="285" width="30" height="30" rx="4" fill="#FFC83D" stroke="#111" stroke-width="2" /><path d="M130,330 l-18,-6 M310,330 l18,-6" fill="none" stroke="#fff" stroke-width="3" /><circle cx="220" cy="330" r="150" fill="#FFC83D" opacity="0.10" stroke="none" stroke-width="1"/><text x="220" y="520" font-size="16" fill="#cde" text-anchor="middle" font-weight="normal" >chest shakes, glow grows, rising tone</text><line x1="402" y1="340" x2="428" y2="340" stroke="#fff" stroke-width="3" marker-end="url(#ar)"/><rect x="430" y="130" width="360" height="420" rx="14" fill="#1b2a3a" stroke="#445" stroke-width="2" /><text x="610" y="170" font-size="26" fill="#FFC83D" text-anchor="middle" font-weight="bold" >2 Reveal</text><text x="610" y="200" font-size="18" fill="#9aa" text-anchor="middle" font-weight="normal" >0.5 s</text><circle cx="610" cy="330" r="130" fill="#fff" opacity="0.35" stroke="none" stroke-width="1"/><polygon points="610,250 680,320 610,390 540,320" fill="#CC79A7" stroke="#111" stroke-width="3"/><text x="610" y="520" font-size="16" fill="#cde" text-anchor="middle" font-weight="normal" >soft flash, item scales 0 to 1.2 to 1, chime</text><line x1="792" y1="340" x2="818" y2="340" stroke="#fff" stroke-width="3" marker-end="url(#ar)"/><rect x="820" y="130" width="360" height="420" rx="14" fill="#1b2a3a" stroke="#445" stroke-width="2" /><text x="1000" y="170" font-size="26" fill="#FFC83D" text-anchor="middle" font-weight="bold" >3 Celebration</text><text x="1000" y="200" font-size="18" fill="#9aa" text-anchor="middle" font-weight="normal" >1.5 s</text><rect x="850" y="230" width="12" height="18" rx="2" fill="#E69F00" stroke="none" stroke-width="0" transform="rotate(0 860 240)"/><rect x="897" y="291" width="12" height="18" rx="2" fill="#56B4E9" stroke="none" stroke-width="0" transform="rotate(25 907 301)"/><rect x="944" y="232" width="12" height="18" rx="2" fill="#CC79A7" stroke="none" stroke-width="0" transform="rotate(50 954 242)"/><rect x="991" y="293" width="12" height="18" rx="2" fill="#7CD86B" stroke="none" stroke-width="0" transform="rotate(75 1001 303)"/><rect x="1038" y="234" width="12" height="18" rx="2" fill="#E69F00" stroke="none" stroke-width="0" transform="rotate(100 1048 244)"/><rect x="1085" y="295" width="12" height="18" rx="2" fill="#56B4E9" stroke="none" stroke-width="0" transform="rotate(125 1095 305)"/><rect x="1132" y="236" width="12" height="18" rx="2" fill="#CC79A7" stroke="none" stroke-width="0" transform="rotate(150 1142 246)"/><rect x="879" y="297" width="12" height="18" rx="2" fill="#7CD86B" stroke="none" stroke-width="0" transform="rotate(175 889 307)"/><rect x="926" y="238" width="12" height="18" rx="2" fill="#E69F00" stroke="none" stroke-width="0" transform="rotate(200 936 248)"/><rect x="973" y="299" width="12" height="18" rx="2" fill="#56B4E9" stroke="none" stroke-width="0" transform="rotate(225 983 309)"/><rect x="1020" y="240" width="12" height="18" rx="2" fill="#CC79A7" stroke="none" stroke-width="0" transform="rotate(250 1030 250)"/><rect x="1067" y="301" width="12" height="18" rx="2" fill="#7CD86B" stroke="none" stroke-width="0" transform="rotate(275 1077 311)"/><rect x="1114" y="242" width="12" height="18" rx="2" fill="#E69F00" stroke="none" stroke-width="0" transform="rotate(300 1124 252)"/><rect x="861" y="303" width="12" height="18" rx="2" fill="#56B4E9" stroke="none" stroke-width="0" transform="rotate(325 871 313)"/><polygon points="1000,270 1060,330 1000,390 940,330" fill="#CC79A7" stroke="#111" stroke-width="3"/><text x="1000" y="430" font-size="26" fill="#fff" text-anchor="middle" font-weight="bold" >Amethyst Gem</text><rect x="930" y="445" width="140" height="32" rx="16" fill="#CC79A7" stroke="none" stroke-width="2" /><text x="1000" y="468" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold" >EPIC</text><text x="1000" y="520" font-size="16" fill="#cde" text-anchor="middle" font-weight="normal" >name and rarity, confetti 60 to 100, fanfare</text><line x1="1182" y1="340" x2="1208" y2="340" stroke="#fff" stroke-width="3" marker-end="url(#ar)"/><rect x="1210" y="130" width="360" height="420" rx="14" fill="#1b2a3a" stroke="#445" stroke-width="2" /><text x="1390" y="170" font-size="26" fill="#FFC83D" text-anchor="middle" font-weight="bold" >4 Collection</text><text x="1390" y="200" font-size="18" fill="#9aa" text-anchor="middle" font-weight="normal" >0.8 s</text><rect x="1480" y="215" width="70" height="50" rx="8" fill="#000a" stroke="#FFC83D" stroke-width="2" /><text x="1515" y="248" font-size="20" fill="#fff" text-anchor="middle" font-weight="normal" >Bag</text><polygon points="1330,370 1360,400 1330,430 1300,400" fill="#CC79A7" stroke="#111" stroke-width="3"/><path d="M1330,400 Q1400,300 1480,245" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#ar)"/><text x="1390" y="520" font-size="16" fill="#cde" text-anchor="middle" font-weight="normal" >item flies to inventory, icon bumps, whoosh</text><rect x="40" y="590" width="1520" height="6" rx="0" fill="#334" stroke="none" stroke-width="2" /><rect x="40.0" y="590" width="456.0" height="6" rx="0" fill="#56B4E9" stroke="none" stroke-width="2" /><rect x="496.0" y="590" width="190.0" height="6" rx="0" fill="#FFC83D" stroke="none" stroke-width="2" /><rect x="686.0" y="590" width="570.0" height="6" rx="0" fill="#CC79A7" stroke="none" stroke-width="2" /><rect x="1256.0" y="590" width="304.0" height="6" rx="0" fill="#7CD86B" stroke="none" stroke-width="2" /><text x="40" y="630" font-size="18" fill="#9aa" text-anchor="start" font-weight="normal" >Timeline 0 to 4 s (rare reward). Small reward: same four beats in 0.8 s.</text><text x="40" y="670" font-size="26" fill="#FFC83D" text-anchor="start" font-weight="bold" >Why this works</text><circle cx="55" cy="706" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="55" y="712" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><text x="80" y="712" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Server grants the item first; the client only plays the show, so players never wait to own it.</text><circle cx="55" cy="752" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="55" y="758" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><text x="80" y="758" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Every beat has a sound; pitch rises with rarity. Reduced-motion setting swaps shake and flash for a fade.</text><circle cx="55" cy="798" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="55" y="804" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><text x="80" y="804" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Repeat rewards shorten (second chest in a row: half length). Never above 6 s.</text><text x="40" y="860" font-size="18" fill="#9aa" text-anchor="start" font-weight="normal" >Rules: reward-moments-and-juice  game-feel-juice</text>
</svg>