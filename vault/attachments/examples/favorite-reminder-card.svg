<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
<title>Favorite reminder card</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#2a1a1a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#7a2a2a" stroke-width="4"/></pattern></defs>
<rect width="1600" height="900" fill="#111"/>
<text x="40" y="56" font-size="38" fill="#fff" text-anchor="start" font-weight="bold" >Favorite reminder card</text><text x="40" y="92" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Ask once after a win, after the player had fun. Easy to dismiss, never repeated in the same session.</text><rect x="48" y="118" width="1024" height="494" rx="34" fill="#000" stroke="#444" stroke-width="4" /><rect x="60" y="130" width="1000" height="470" rx="14" fill="#1b2a3a" stroke="none" stroke-width="2" /><rect x="60" y="130" width="1000" height="470" rx="14" fill="#2b6b8f" stroke="none" stroke-width="2" /><rect x="60" y="430" width="1000" height="170" rx="0" fill="#4a8f3a" stroke="none" stroke-width="2" /><rect x="533.0" y="453.0" width="54.0" height="48.0" rx="4.8" fill="#3B82F6" stroke="#111" stroke-width="3" /><rect x="530.0" y="390.0" width="60" height="60" rx="7.199999999999999" fill="#FFD27F" stroke="#111" stroke-width="3" /><circle cx="548.0" cy="415.2" r="5.3999999999999995" fill="#111" stroke="none" stroke-width="2"/><circle cx="572.0" cy="415.2" r="5.3999999999999995" fill="#111" stroke="none" stroke-width="2"/><path d="M546.8,429.0 Q560,442.8 573.2,429.0" fill="none" stroke="#111" stroke-width="3" /><rect x="330" y="200" width="460" height="240" rx="18" fill="#14202c" stroke="#fff" stroke-width="3" /><polygon points="560.0,222.0 570.1,246.2 596.1,248.3 576.3,265.3 582.3,290.7 560.0,277.1 537.7,290.7 543.7,265.3 523.9,248.3 549.9,246.2" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="560" y="335" font-size="28" fill="#fff" text-anchor="middle" font-weight="bold" >Enjoying the game?</text><text x="560" y="368" font-size="19" fill="#cde" text-anchor="middle" font-weight="normal" >Tap the star in the game page to favorite it.</text><rect x="370" y="390" width="180" height="40" rx="10" fill="#2fb35a" stroke="none" stroke-width="2" /><text x="460" y="418" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold" >Show me how</text><rect x="570" y="390" width="180" height="40" rx="10" fill="#334" stroke="none" stroke-width="2" /><text x="660" y="418" font-size="19" fill="#cde" text-anchor="middle" font-weight="normal" >Maybe later</text><circle cx="470" cy="260" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="470" y="266" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><circle cx="340" cy="215" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="340" y="221" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><circle cx="380" cy="400" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="380" y="406" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><circle cx="760" cy="400" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="760" y="406" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >4</text><text x="1110" y="150" font-size="26" fill="#FFC83D" text-anchor="start" font-weight="bold" >Why this works</text><circle cx="1125" cy="186" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="192" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><text x="1150" y="192" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Trigger after a happy moment (a win or</text><text x="1150" y="216" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >finished quest), not on join.</text><circle cx="1125" cy="260" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="266" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><text x="1150" y="266" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Plain reason in one line. No bribe, no</text><text x="1150" y="290" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >guilt.</text><circle cx="1125" cy="334" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="340" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><text x="1150" y="340" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Primary button teaches where to tap; no</text><text x="1150" y="364" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >forced action.</text><circle cx="1125" cy="408" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="414" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >4</text><text x="1150" y="414" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Maybe later is equal size and works. Do not</text><text x="1150" y="438" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >ask again this session.</text><text x="40" y="660" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Favorites feed the notification and recommendation loop, but trust matters more than the count. No reward gated behind the favorite.</text><text x="40" y="695" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Rules: favorite-and-follow-prompts</text>
</svg>