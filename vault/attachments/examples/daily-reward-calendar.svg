<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
<title>Daily reward calendar</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#2a1a1a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#7a2a2a" stroke-width="4"/></pattern></defs>
<rect width="1600" height="900" fill="#111"/>
<text x="40" y="56" font-size="38" fill="#fff" text-anchor="start" font-weight="bold" >Daily reward calendar</text><text x="40" y="92" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >7 days, today highlighted, day 7 is the big one. Missing a day does not wipe progress.</text><rect x="40" y="170" width="195" height="300" rx="14" fill="#2a4a35" stroke="#445" stroke-width="2" /><text x="137" y="208" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold" >Day 1</text><circle cx="137" cy="300" r="34" fill="#FFC83D" stroke="#B8860B" stroke-width="3"/><text x="137" y="311.9" font-size="37.400000000000006" fill="#8a5a00" text-anchor="middle" font-weight="bold" >$</text><text x="137" y="400" font-size="22" fill="#fff" text-anchor="middle" font-weight="normal" >100 coins</text><text x="137" y="450" font-size="18" fill="#7CD86B" text-anchor="middle" font-weight="bold" >CLAIMED</text><path d="M100,330 l25,25 l50,-50" fill="none" stroke="#7CD86B" stroke-width="8" /><rect x="255" y="170" width="195" height="300" rx="14" fill="#2a4a35" stroke="#445" stroke-width="2" /><text x="352" y="208" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold" >Day 2</text><circle cx="352" cy="300" r="34" fill="#FFC83D" stroke="#B8860B" stroke-width="3"/><text x="352" y="311.9" font-size="37.400000000000006" fill="#8a5a00" text-anchor="middle" font-weight="bold" >$</text><text x="352" y="400" font-size="22" fill="#fff" text-anchor="middle" font-weight="normal" >200 coins</text><text x="352" y="450" font-size="18" fill="#7CD86B" text-anchor="middle" font-weight="bold" >CLAIMED</text><path d="M315,330 l25,25 l50,-50" fill="none" stroke="#7CD86B" stroke-width="8" /><rect x="470" y="170" width="195" height="300" rx="14" fill="#2a4a35" stroke="#445" stroke-width="2" /><text x="567" y="208" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold" >Day 3</text><circle cx="567" cy="300" r="34" fill="#FFC83D" stroke="#B8860B" stroke-width="3"/><text x="567" y="311.9" font-size="37.400000000000006" fill="#8a5a00" text-anchor="middle" font-weight="bold" >$</text><text x="567" y="400" font-size="22" fill="#fff" text-anchor="middle" font-weight="normal" >300 coins</text><text x="567" y="450" font-size="18" fill="#7CD86B" text-anchor="middle" font-weight="bold" >CLAIMED</text><path d="M530,330 l25,25 l50,-50" fill="none" stroke="#7CD86B" stroke-width="8" /><rect x="685" y="170" width="195" height="300" rx="14" fill="#3a3410" stroke="#FFC83D" stroke-width="5" /><text x="782" y="208" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold" >Day 4</text><circle cx="782" cy="300" r="34" fill="#FFC83D" stroke="#B8860B" stroke-width="3"/><text x="782" y="311.9" font-size="37.400000000000006" fill="#8a5a00" text-anchor="middle" font-weight="bold" >$</text><text x="782" y="400" font-size="22" fill="#fff" text-anchor="middle" font-weight="normal" >400 coins</text><rect x="705" y="425" width="155" height="38" rx="10" fill="#2fb35a" stroke="none" stroke-width="2" /><text x="782" y="452" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" >CLAIM</text><rect x="900" y="170" width="195" height="300" rx="14" fill="#1c2733" stroke="#445" stroke-width="2" /><text x="997" y="208" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold" >Day 5</text><circle cx="997" cy="300" r="34" fill="#FFC83D" stroke="#B8860B" stroke-width="3"/><text x="997" y="311.9" font-size="37.400000000000006" fill="#8a5a00" text-anchor="middle" font-weight="bold" >$</text><text x="997" y="400" font-size="22" fill="#fff" text-anchor="middle" font-weight="normal" >500 coins</text><text x="997" y="450" font-size="18" fill="#9aa" text-anchor="middle" font-weight="normal" >in 1 day</text><rect x="1115" y="170" width="195" height="300" rx="14" fill="#1c2733" stroke="#445" stroke-width="2" /><text x="1212" y="208" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold" >Day 6</text><circle cx="1212" cy="300" r="34" fill="#FFC83D" stroke="#B8860B" stroke-width="3"/><text x="1212" y="311.9" font-size="37.400000000000006" fill="#8a5a00" text-anchor="middle" font-weight="bold" >$</text><text x="1212" y="400" font-size="22" fill="#fff" text-anchor="middle" font-weight="normal" >600 coins</text><text x="1212" y="450" font-size="18" fill="#9aa" text-anchor="middle" font-weight="normal" >in 2 days</text><rect x="1330" y="170" width="195" height="300" rx="14" fill="#1c2733" stroke="#445" stroke-width="2" /><text x="1427" y="208" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold" >Day 7</text><polygon points="1427.0,245.0 1441.5,280.0 1479.3,283.0 1450.5,307.6 1459.3,344.5 1427.0,324.8 1394.7,344.5 1403.5,307.6 1374.7,283.0 1412.5,280.0" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1427" y="400" font-size="22" fill="#FFC83D" text-anchor="middle" font-weight="bold" >Rare pet</text><text x="1427" y="450" font-size="18" fill="#9aa" text-anchor="middle" font-weight="normal" >in 3 days</text><circle cx="782" cy="160" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="782" y="166" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><circle cx="1427" cy="160" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1427" y="166" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><circle cx="60" cy="533" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="60" y="539" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><text x="40" y="540" font-size="19" fill="#cde" text-anchor="start" font-weight="normal" >Streak reset rule shown in plain words: miss a day and you restart at a gentler day, never at zero shame.</text><text x="40" y="590" font-size="26" fill="#FFC83D" text-anchor="start" font-weight="bold" >Why this works</text><circle cx="55" cy="626" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="55" y="632" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><text x="80" y="632" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Today is the only glowing card with one green Claim button.</text><circle cx="55" cy="668" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="55" y="674" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><text x="80" y="674" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Day 7 reward is visible from day 1: an open loop that pulls the player back.</text><circle cx="55" cy="710" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="55" y="716" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><text x="80" y="716" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Rules text is honest and kind. No fake countdown, no guilt message.</text><text x="40" y="860" font-size="18" fill="#9aa" text-anchor="start" font-weight="normal" >Rules: day-1-day-7-day-30-playbook  reward-moments-and-juice  notifications-and-reengagement</text>
</svg>