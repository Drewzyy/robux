<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
<title>Core loop diagram</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#2a1a1a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#7a2a2a" stroke-width="4"/></pattern></defs>
<rect width="1600" height="900" fill="#111"/>
<text x="40" y="56" font-size="38" fill="#fff" text-anchor="start" font-weight="bold" >Core loop diagram</text><text x="40" y="92" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Do, get, spend, grow, repeat. Every lap shows a bigger number and unlocks a new thing to want.</text><line x1="628.7664445218705" y1="289.96174644486024" x2="738.5082497148694" y2="369.69383501765344" stroke="#fff" stroke-width="4" marker-end="url(#ar)"/><line x1="781.0082497148694" y1="500.4953853476017" x2="739.0906101179136" y2="629.5046146523983" stroke="#fff" stroke-width="4" marker-end="url(#ar)"/><line x1="627.824165596043" y1="710.3444185374864" x2="492.175834403957" y2="710.3444185374864" stroke="#fff" stroke-width="4" marker-end="url(#ar)"/><line x1="380.9093898820865" y1="629.5046146523983" x2="338.9917502851306" y2="500.49538534760177" stroke="#fff" stroke-width="4" marker-end="url(#ar)"/><line x1="381.4917502851306" y1="369.6938350176535" x2="491.23355547812946" y2="289.96174644486024" stroke="#fff" stroke-width="4" marker-end="url(#ar)"/><circle cx="560.0" cy="240.0" r="72" fill="#FF7A59" stroke="#111" stroke-width="4"/><text x="560.0" y="242.0" font-size="26" fill="#111" text-anchor="middle" font-weight="bold" >DO</text><text x="560.0" y="268.0" font-size="14" fill="#111" text-anchor="middle" font-weight="normal" >tap, mine, jump</text><circle cx="807.27469423674" cy="419.6555814625137" r="72" fill="#FFC83D" stroke="#111" stroke-width="4"/><text x="807.27469423674" y="421.6555814625137" font-size="26" fill="#111" text-anchor="middle" font-weight="bold" >EARN</text><text x="807.27469423674" y="447.6555814625137" font-size="14" fill="#111" text-anchor="middle" font-weight="normal" >coins and drops</text><circle cx="712.824165596043" cy="710.3444185374864" r="72" fill="#7CD86B" stroke="#111" stroke-width="4"/><text x="712.824165596043" y="712.3444185374864" font-size="26" fill="#111" text-anchor="middle" font-weight="bold" >SPEND</text><text x="712.824165596043" y="738.3444185374864" font-size="14" fill="#111" text-anchor="middle" font-weight="normal" >upgrade or buy</text><circle cx="407.175834403957" cy="710.3444185374864" r="72" fill="#56B4E9" stroke="#111" stroke-width="4"/><text x="407.175834403957" y="712.3444185374864" font-size="26" fill="#111" text-anchor="middle" font-weight="bold" >GROW</text><text x="407.175834403957" y="738.3444185374864" font-size="14" fill="#111" text-anchor="middle" font-weight="normal" >stronger, faster</text><circle cx="312.72530576326005" cy="419.65558146251374" r="72" fill="#CC79A7" stroke="#111" stroke-width="4"/><text x="312.72530576326005" y="421.65558146251374" font-size="26" fill="#111" text-anchor="middle" font-weight="bold" >UNLOCK</text><text x="312.72530576326005" y="447.65558146251374" font-size="14" fill="#111" text-anchor="middle" font-weight="normal" >new zone or goal</text><text x="560" y="500" font-size="24" fill="#9aa" text-anchor="middle" font-weight="normal" >one lap</text><text x="560" y="528" font-size="20" fill="#9aa" text-anchor="middle" font-weight="normal" >20 to 60 s</text><text x="1110" y="140" font-size="26" fill="#FFC83D" text-anchor="start" font-weight="bold" >Why this works</text><circle cx="1125" cy="176" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="182" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><text x="1150" y="182" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >The loop is short: one lap in 20 to 60 s, so</text><text x="1150" y="206" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >feedback is constant.</text><circle cx="1125" cy="250" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="256" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><text x="1150" y="256" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Every node has a sound and a number change</text><text x="1150" y="280" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >you can see.</text><circle cx="1125" cy="324" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="330" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><text x="1150" y="330" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Spend feeds Grow: the next lap is easier or</text><text x="1150" y="354" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >bigger. That is the pull.</text><circle cx="1125" cy="398" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="404" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >4</text><text x="1150" y="404" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Unlock opens a goal outside the loop: the</text><text x="1150" y="428" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >reason to start another lap.</text><circle cx="1125" cy="472" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="478" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >5</text><text x="1150" y="478" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >No dead node: if a step is boring, merge or</text><text x="1150" y="502" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >cut it.</text><text x="1110" y="700" font-size="19" fill="#9aa" text-anchor="start" font-weight="normal" >Rules: core-loop-template  loop-stack  economy-math</text>
</svg>