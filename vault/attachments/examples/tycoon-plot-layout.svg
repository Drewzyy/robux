<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
<title>Tycoon plot layout</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#2a1a1a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#7a2a2a" stroke-width="4"/></pattern></defs>
<rect width="1600" height="900" fill="#111"/>
<text x="40" y="56" font-size="38" fill="#fff" text-anchor="start" font-weight="bold" >Tycoon plot layout</text><text x="40" y="92" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Top-down plot: entrance, income engine, then upgrade pads in the order the player should buy them.</text><rect x="40" y="120" width="1040" height="720" rx="14" fill="#2f5a3c" stroke="none" stroke-width="2" /><rect x="80" y="160" width="960" height="640" rx="10" fill="#3d7a4d" stroke="#fff" stroke-width="3" /><rect x="80" y="430" width="60" height="100" rx="0" fill="#bda46a" stroke="none" stroke-width="2" /><text x="110" y="420" font-size="16" fill="#fff" text-anchor="middle" font-weight="normal" >Entrance</text><rect x="200" y="240" width="140" height="100" rx="8" fill="#56B4E9" stroke="#111" stroke-width="3" /><text x="270" y="298" font-size="22" fill="#111" text-anchor="middle" font-weight="bold" >Dropper</text><rect x="340" y="275" width="360" height="30" rx="0" fill="#555" stroke="#111" stroke-width="3" /><path d="M360,290 L680,290" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="14 10" marker-end="url(#ar)"/><rect x="700" y="240" width="140" height="100" rx="8" fill="#FFC83D" stroke="#111" stroke-width="3" /><text x="770" y="298" font-size="22" fill="#111" text-anchor="middle" font-weight="bold" >Collector</text><rect x="560" y="430" width="160" height="100" rx="8" fill="#7CD86B" stroke="#111" stroke-width="3" /><text x="640" y="488" font-size="22" fill="#111" text-anchor="middle" font-weight="bold" >Cash pad</text><rect x="140" y="570" width="170" height="60" rx="8" fill="#FF7A59" stroke="#111" stroke-width="3" /><text x="225" y="607" font-size="17" fill="#111" text-anchor="middle" font-weight="bold" >Pad 1: Dropper 2</text><circle cx="144" cy="570" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="144" y="576" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><rect x="340" y="570" width="170" height="60" rx="8" fill="#FF7A59" stroke="#111" stroke-width="3" /><text x="425" y="607" font-size="17" fill="#111" text-anchor="middle" font-weight="bold" >Pad 2: Belt speed</text><circle cx="344" cy="570" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="344" y="576" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><rect x="540" y="570" width="170" height="60" rx="8" fill="#FF7A59" stroke="#111" stroke-width="3" /><text x="625" y="607" font-size="17" fill="#111" text-anchor="middle" font-weight="bold" >Pad 3: Dropper 3</text><circle cx="544" cy="570" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="544" y="576" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><rect x="740" y="570" width="170" height="60" rx="8" fill="#555" stroke="#111" stroke-width="3" /><text x="825" y="607" font-size="17" fill="#111" text-anchor="middle" font-weight="bold" >Pad 4: Gate</text><circle cx="744" cy="570" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="744" y="576" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >4</text><rect x="900" y="420" width="130" height="260" rx="6" fill="#555" stroke="#fff" stroke-width="2" stroke-dasharray="8 6"/><text x="965" y="560" font-size="20" fill="#ccc" text-anchor="middle" font-weight="normal" >Expansion</text><text x="965" y="585" font-size="16" fill="#999" text-anchor="middle" font-weight="normal" >locked</text><path d="M140,480 C300,480 400,520 560,480" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#ar)"/><circle cx="270" cy="230" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="270" y="236" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><circle cx="520" cy="320" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="520" y="326" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><circle cx="770" cy="230" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="770" y="236" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><circle cx="640" cy="420" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="640" y="426" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >4</text><text x="1110" y="140" font-size="26" fill="#FFC83D" text-anchor="start" font-weight="bold" >Why this works</text><circle cx="1125" cy="176" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="182" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><text x="1150" y="182" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Dropper first: the player sees stuff</text><text x="1150" y="206" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >happening within 10 s.</text><circle cx="1125" cy="250" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="256" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><text x="1150" y="256" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >One short belt: cause to effect is visible</text><text x="1150" y="280" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >without text.</text><circle cx="1125" cy="324" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="330" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><text x="1150" y="330" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Collector and cash pad are close, so</text><text x="1150" y="354" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >collecting feels instant.</text><circle cx="1125" cy="398" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="404" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >4</text><text x="1150" y="404" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Cash pad then upgrade pads: cheapest first,</text><text x="1150" y="428" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >the next one always in sight.</text><circle cx="1125" cy="472" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="478" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >5</text><text x="1150" y="478" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Expansion area is visible but locked: a goal</text><text x="1150" y="502" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >for later.</text><text x="1110" y="700" font-size="19" fill="#9aa" text-anchor="start" font-weight="normal" >Rules: core-loop-template  economy-math</text><text x="1110" y="730" font-size="19" fill="#9aa" text-anchor="start" font-weight="normal" >First purchase should land within 30 s.</text>
</svg>