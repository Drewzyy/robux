<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
<title>Good shop screen</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#2a1a1a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#7a2a2a" stroke-width="4"/></pattern></defs>
<rect width="1600" height="900" fill="#111"/>
<text x="40" y="56" font-size="38" fill="#fff" text-anchor="start" font-weight="bold" >Good shop screen</text><text x="40" y="92" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Price visible, one accent button, big close, shop never opens by itself.</text><rect x="48" y="118" width="1024" height="494" rx="34" fill="#000" stroke="#444" stroke-width="4" /><rect x="60" y="130" width="1000" height="470" rx="14" fill="#1b2a3a" stroke="none" stroke-width="2" /><rect x="60" y="130" width="1000" height="470" rx="14" fill="#14202c" stroke="none" stroke-width="2" /><text x="90" y="175" font-size="30" fill="#fff" text-anchor="start" font-weight="bold" >Pet Shop</text><circle cx="900" cy="162" r="14" fill="#FFC83D" stroke="#B8860B" stroke-width="3"/><text x="900" y="166.9" font-size="15.400000000000002" fill="#8a5a00" text-anchor="middle" font-weight="bold" >$</text><text x="925" y="171" font-size="22" fill="#FFC83D" text-anchor="start" font-weight="bold" >1,250</text><rect x="985" y="140" width="60" height="60" rx="12" fill="#d44" stroke="#fff" stroke-width="3" /><text x="1015" y="182" font-size="32" fill="#fff" text-anchor="middle" font-weight="bold" >X</text><rect x="90" y="215" width="215" height="300" rx="14" fill="#1f3347" stroke="#8DB596" stroke-width="3" /><rect x="110" y="235" width="175" height="130" rx="10" fill="#8DB596" stroke="none" stroke-width="2" /><polygon points="197,260 237,300 197,340 157,300" fill="#fff6" stroke="#111" stroke-width="3"/><text x="197" y="395" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold" >Puppy</text><text x="197" y="425" font-size="16" fill="#8DB596" text-anchor="middle" font-weight="normal" >Rarity: Common</text><rect x="110" y="445" width="175" height="54" rx="10" fill="#2fb35a" stroke="none" stroke-width="2" /><circle cx="140" cy="472" r="12" fill="#FFC83D" stroke="#B8860B" stroke-width="3"/><text x="140" y="476.2" font-size="13.200000000000001" fill="#8a5a00" text-anchor="middle" font-weight="bold" >$</text><text x="210" y="481" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold" >200</text><rect x="325" y="215" width="215" height="300" rx="14" fill="#1f3347" stroke="#56B4E9" stroke-width="3" /><rect x="345" y="235" width="175" height="130" rx="10" fill="#56B4E9" stroke="none" stroke-width="2" /><polygon points="432,260 472,300 432,340 392,300" fill="#fff6" stroke="#111" stroke-width="3"/><text x="432" y="395" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold" >Cat</text><text x="432" y="425" font-size="16" fill="#56B4E9" text-anchor="middle" font-weight="normal" >Rarity: Rare</text><rect x="345" y="445" width="175" height="54" rx="10" fill="#2fb35a" stroke="none" stroke-width="2" /><circle cx="375" cy="472" r="12" fill="#FFC83D" stroke="#B8860B" stroke-width="3"/><text x="375" y="476.2" font-size="13.200000000000001" fill="#8a5a00" text-anchor="middle" font-weight="bold" >$</text><text x="445" y="481" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold" >450</text><rect x="560" y="215" width="215" height="300" rx="14" fill="#1f3347" stroke="#CC79A7" stroke-width="3" /><rect x="580" y="235" width="175" height="130" rx="10" fill="#CC79A7" stroke="none" stroke-width="2" /><polygon points="667,260 707,300 667,340 627,300" fill="#fff6" stroke="#111" stroke-width="3"/><text x="667" y="395" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold" >Fox</text><text x="667" y="425" font-size="16" fill="#CC79A7" text-anchor="middle" font-weight="normal" >Rarity: Epic</text><rect x="580" y="445" width="175" height="54" rx="10" fill="#2fb35a" stroke="none" stroke-width="2" /><circle cx="610" cy="472" r="12" fill="#FFC83D" stroke="#B8860B" stroke-width="3"/><text x="610" y="476.2" font-size="13.200000000000001" fill="#8a5a00" text-anchor="middle" font-weight="bold" >$</text><text x="680" y="481" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold" >900</text><rect x="795" y="215" width="215" height="300" rx="14" fill="#1f3347" stroke="#E69F00" stroke-width="3" /><rect x="815" y="235" width="175" height="130" rx="10" fill="#E69F00" stroke="none" stroke-width="2" /><polygon points="902,260 942,300 902,340 862,300" fill="#fff6" stroke="#111" stroke-width="3"/><text x="902" y="395" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold" >Dragon</text><text x="902" y="425" font-size="16" fill="#E69F00" text-anchor="middle" font-weight="normal" >Rarity: Legendary</text><rect x="815" y="445" width="175" height="54" rx="10" fill="#555" stroke="none" stroke-width="2" /><circle cx="845" cy="472" r="12" fill="#FFC83D" stroke="#B8860B" stroke-width="3"/><text x="845" y="476.2" font-size="13.200000000000001" fill="#8a5a00" text-anchor="middle" font-weight="bold" >$</text><text x="915" y="481" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold" >2,500</text><text x="90" y="555" font-size="18" fill="#cde" text-anchor="start" font-weight="normal" >Egg odds: Common 70%  Rare 22%  Epic 7%  Legendary 1%  (tap for full list)</text><circle cx="160" cy="236" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="160" y="242" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><circle cx="1015" cy="150" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1015" y="156" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><circle cx="215" cy="478" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="215" y="484" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><circle cx="150" cy="556" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="150" y="562" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >4</text><circle cx="930" cy="142" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="930" y="148" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >5</text><text x="1110" y="150" font-size="26" fill="#FFC83D" text-anchor="start" font-weight="bold" >Why this works</text><circle cx="1125" cy="186" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="192" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >1</text><text x="1150" y="192" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Price is on the button before any prompt.</text><circle cx="1125" cy="236" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="242" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >2</text><text x="1150" y="242" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Big 60 px close X, top-right. Easy exit.</text><circle cx="1125" cy="286" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="292" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >3</text><text x="1150" y="292" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >One green accent means Buy; locked items go</text><text x="1150" y="316" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >grey, not hidden.</text><circle cx="1125" cy="360" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="366" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >4</text><text x="1150" y="366" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Odds shown for anything random. Always.</text><circle cx="1125" cy="410" r="15" fill="#FFC83D" stroke="#111" stroke-width="2"/><text x="1125" y="416" font-size="18" fill="#111" text-anchor="middle" font-weight="bold" >5</text><text x="1150" y="416" font-size="19" fill="#ddd" text-anchor="start" font-weight="normal" >Balance visible while shopping.</text><text x="40" y="660" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Opened only by a player tap on the shop button. Never on join, on death, or in the first 5 minutes. Core action stays reachable.</text><text x="40" y="695" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Rules: shop-ui  color-palettes</text>
</svg>