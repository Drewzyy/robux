<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
<title>Onboarding first 60 seconds</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#2a1a1a"/><line x1="0" y1="0" x2="0" y2="12" stroke="#7a2a2a" stroke-width="4"/></pattern></defs>
<rect width="1600" height="900" fill="#111"/>
<text x="40" y="56" font-size="38" fill="#fff" text-anchor="start" font-weight="bold" >Onboarding: the first 60 seconds</text><text x="40" y="92" font-size="20" fill="#9aa" text-anchor="start" font-weight="normal" >Play first, explain by doing. No shop, no popups, no walls of text in minute one.</text><line x1="100" y1="420" x2="1500" y2="420" stroke="#fff" stroke-width="5" /><circle cx="100.0" cy="420" r="16" fill="#7CD86B" stroke="#111" stroke-width="3"/><text x="100.0" y="455" font-size="22" fill="#7CD86B" text-anchor="middle" font-weight="bold" >0 s</text><line x1="100.0" y1="436" x2="100.0" y2="500" stroke="#7CD86B" stroke-width="3" /><rect x="-30.0" y="500" width="260" height="100" rx="10" fill="#1b2a3a" stroke="#7CD86B" stroke-width="2" /><text x="100.0" y="530" font-size="17" fill="#ddd" text-anchor="middle" font-weight="normal" >Spawn already looking at the</text><text x="100.0" y="554" font-size="17" fill="#ddd" text-anchor="middle" font-weight="normal" >goal. No loading card.</text><circle cx="286.66666666666663" cy="420" r="16" fill="#56B4E9" stroke="#111" stroke-width="3"/><text x="286.66666666666663" y="395" font-size="22" fill="#56B4E9" text-anchor="middle" font-weight="bold" >8 s</text><line x1="286.66666666666663" y1="404" x2="286.66666666666663" y2="320" stroke="#56B4E9" stroke-width="3" /><rect x="156.66666666666663" y="250" width="260" height="70" rx="10" fill="#1b2a3a" stroke="#56B4E9" stroke-width="2" /><text x="286.66666666666663" y="280" font-size="17" fill="#ddd" text-anchor="middle" font-weight="normal" >First interaction within 30</text><text x="286.66666666666663" y="304" font-size="17" fill="#ddd" text-anchor="middle" font-weight="normal" >studs. One prompt word.</text><circle cx="566.6666666666667" cy="420" r="16" fill="#FFC83D" stroke="#111" stroke-width="3"/><text x="566.6666666666667" y="455" font-size="22" fill="#FFC83D" text-anchor="middle" font-weight="bold" >20 s</text><line x1="566.6666666666667" y1="436" x2="566.6666666666667" y2="500" stroke="#FFC83D" stroke-width="3" /><rect x="436.66666666666674" y="500" width="260" height="100" rx="10" fill="#1b2a3a" stroke="#FFC83D" stroke-width="2" /><text x="566.6666666666667" y="530" font-size="17" fill="#ddd" text-anchor="middle" font-weight="normal" >First reward: coins pop,</text><text x="566.6666666666667" y="554" font-size="17" fill="#ddd" text-anchor="middle" font-weight="normal" >sound, counter ticks.</text><circle cx="916.6666666666666" cy="420" r="16" fill="#E69F00" stroke="#111" stroke-width="3"/><text x="916.6666666666666" y="395" font-size="22" fill="#E69F00" text-anchor="middle" font-weight="bold" >35 s</text><line x1="916.6666666666666" y1="404" x2="916.6666666666666" y2="320" stroke="#E69F00" stroke-width="3" /><rect x="786.6666666666666" y="250" width="260" height="70" rx="10" fill="#1b2a3a" stroke="#E69F00" stroke-width="2" /><text x="916.6666666666666" y="280" font-size="17" fill="#ddd" text-anchor="middle" font-weight="normal" >Second lap is faster. Show</text><text x="916.6666666666666" y="304" font-size="17" fill="#ddd" text-anchor="middle" font-weight="normal" >the progress bar.</text><circle cx="1220.0" cy="420" r="16" fill="#CC79A7" stroke="#111" stroke-width="3"/><text x="1220.0" y="455" font-size="22" fill="#CC79A7" text-anchor="middle" font-weight="bold" >48 s</text><line x1="1220.0" y1="436" x2="1220.0" y2="500" stroke="#CC79A7" stroke-width="3" /><rect x="1090.0" y="500" width="260" height="100" rx="10" fill="#1b2a3a" stroke="#CC79A7" stroke-width="2" /><text x="1220.0" y="530" font-size="17" fill="#ddd" text-anchor="middle" font-weight="normal" >First goal revealed: egg or</text><text x="1220.0" y="554" font-size="17" fill="#ddd" text-anchor="middle" font-weight="normal" >upgrade, one step away.</text><circle cx="1500.0" cy="420" r="16" fill="#FF7A59" stroke="#111" stroke-width="3"/><text x="1500.0" y="395" font-size="22" fill="#FF7A59" text-anchor="middle" font-weight="bold" >60 s</text><line x1="1500.0" y1="404" x2="1500.0" y2="320" stroke="#FF7A59" stroke-width="3" /><rect x="1370.0" y="250" width="260" height="70" rx="10" fill="#1b2a3a" stroke="#FF7A59" stroke-width="2" /><text x="1500.0" y="280" font-size="17" fill="#ddd" text-anchor="middle" font-weight="normal" >First purchase done. Player</text><text x="1500.0" y="304" font-size="17" fill="#ddd" text-anchor="middle" font-weight="normal" >owns something.</text><rect x="100" y="700" width="1400" height="40" rx="8" fill="#223" stroke="none" stroke-width="2" /><rect x="100.0" y="700" width="466.6666666666667" height="40" rx="8" fill="#2a4a35" stroke="none" stroke-width="2" /><text x="333.33333333333337" y="727" font-size="18" fill="#fff" text-anchor="middle" font-weight="normal" >learn by moving</text><rect x="566.6666666666667" y="700" width="653.3333333333334" height="40" rx="8" fill="#2a3a55" stroke="none" stroke-width="2" /><text x="893.3333333333334" y="727" font-size="18" fill="#fff" text-anchor="middle" font-weight="normal" >loop clicks</text><rect x="1220.0" y="700" width="280.0" height="40" rx="8" fill="#55402a" stroke="none" stroke-width="2" /><text x="1360.0" y="727" font-size="18" fill="#fff" text-anchor="middle" font-weight="normal" >hook</text><text x="40" y="800" font-size="19" fill="#cde" text-anchor="start" font-weight="normal" >Never in the first 5 minutes: shop popups, favorite asks, sale banners. Keep HUD to 4 elements and add more as features appear.</text><text x="40" y="835" font-size="19" fill="#9aa" text-anchor="start" font-weight="normal" >Rules: day-1-day-7-day-30-playbook  hud-template  shop-ui</text>
</svg>